<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dettaglio ordine · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <button class="icon-btn" onclick="indietro()" aria-label="Torna agli ordini"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Dettaglio ordine</h1>
</header>
<main class="page">
    <div id="ordine_info" class="card order-edit">
        <div class="field full">
            <label for="info_destinatario">Destinatario</label>
            <input type="text" id="info_destinatario" onchange="salvaInfoOrdine('destinatario', this)">
        </div>
        <div class="field">
            <label for="info_scadenza">Scadenza</label>
            <input type="date" id="info_scadenza" onchange="salvaInfoOrdine('scadenza_consegna', this)">
        </div>
        <div class="field">
            <label>Stato</label>
            <span id="info_stato"></span>
        </div>
        <p class="salvato full" id="info_salvato" aria-live="polite"></p>
    </div>
    <p class="hint">Tocca ✔ / ✘ per aggiornare. Tocca il prezzo per modificarlo, tocca due volte il prodotto per la nota.</p>
    <div class="table-wrap wide">
        <table id="table_dettaglio">
            <thead>
                <tr>
                    <th>Prodotto</th>
                    <th>Prezzo</th>
                    <th>Immagine</th>
                    <th>Preparato</th>
                    <th>Consegnato</th>
                    <th>Pagato</th>
                </tr>
            </thead>
            <tbody><tr><td colspan="6" class="loading">Caricamento…</td></tr></tbody>
        </table>
    </div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaRiga()">Elimina riga</button>
        <button class="btn btn-primary" onclick="aggiungiRiga()">+ Aggiungi prodotto</button>
    </div>
</footer>
<div id="notaModal" class="modal">
    <div class="modal-content">
        <h3>Nota</h3>
        <textarea id="notaEditor" rows="6"></textarea>
        <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="chiudiNota()">Chiudi</button>
            <button class="btn btn-primary" onclick="salvaNota()">Salva</button>
        </div>
    </div>
</div>
<script>
    const { createClient } = supabase;

    const db = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const ordineID = urlParams.get("id");

    let righeCache = [];
    let selezionata = null;
    let destinatarioOrdine = "";
    let rigaNotaSelezionata = null;


    window.onload = () => {
        loadOrdineInfo();
        loadDettaglio();
    };

    async function loadOrdineInfo() {
        const { data } = await db
            .from("ordini")
            .select("*")
            .eq("id", ordineID)
            .single();

        destinatarioOrdine = data.destinatario;

        document.getElementById("info_destinatario").value = data.destinatario;
        document.getElementById("info_scadenza").value = data.scadenza_consegna;
        document.getElementById("info_stato").innerText = data.stato;
    }

    // Modifica destinatario o scadenza: salva appena esci dal campo
    async function salvaInfoOrdine(campo, input) {
        const valore = input.value.trim();
        const avviso = document.getElementById("info_salvato");
        if (!valore) {
            alert(campo === "destinatario" ? "Il destinatario non può essere vuoto." : "Inserisci una data di scadenza.");
            loadOrdineInfo();
            return;
        }

        const { error } = await db
            .from("ordini")
            .update({ [campo]: valore })
            .eq("id", ordineID);

        if (error) {
            alert("Errore durante il salvataggio.");
            loadOrdineInfo();
            return;
        }

        if (campo === "destinatario") destinatarioOrdine = valore;
        avviso.textContent = "Salvato ✓";
        setTimeout(() => { avviso.textContent = ""; }, 2000);
    }

    async function loadDettaglio() {
        checkStatoOrdine();
        const { data } = await db
            .from("ordine_dettaglio")
            .select("*")
            .eq("ordineid", ordineID);

        righeCache = data;
        renderDettaglio();
    }

    async function renderDettaglio() {
        const tbody = document.querySelector("#table_dettaglio tbody");
        tbody.innerHTML = "";

        for (const row of righeCache) {

            let imgTag = "";
            const { data: colore } = await db
                .from("colorazioni")
                .select("percorsoimmagine")
                .eq("id", row.colorazioneid)
                .single();

            if (colore && colore.percorsoimmagine) {
                imgTag = `<img src="${colore.percorsoimmagine}">`;
            }

            const tr = document.createElement("tr");

            tr.onclick = () => {
                selezionata = row;
                evidenziaRiga(tr);
            };

            tr.innerHTML = `
                <td ondblclick="apriNota('${row.id}','${row.nota}')">
                    ${row.colorazioneid}
                </td>

                <td contenteditable="true" 
                    onblur="updatePrezzo('${row.id}', this.innerText)">
                    ${row.prezzo}
                </td>

                <td class="img-cell">${imgTag}</td>

                <td class="flag-btn ${row.preparato ? 'flag-true' : 'flag-false'}"
                    onclick="togglePreparato('${row.id}', ${row.preparato})">
                    ${row.preparato ? '✔' : '✘'}
                </td>

                <td class="flag-btn ${row.consegnato ? 'flag-true' : 'flag-false'}"
                    onclick="toggleConsegnato('${row.id}', ${row.consegnato})">
                    ${row.consegnato ? '✔' : '✘'}
                </td>

                <td class="flag-btn ${row.pagato ? 'flag-true' : 'flag-false'}"
                    onclick="togglePagato('${row.id}', ${row.pagato}, '${row.colorazioneid}', ${row.prezzo})">
                    ${row.pagato ? '✔' : '✘'}
                </td>
            `;

            tbody.appendChild(tr);
        }
    }

    function apriNota(id, nota) {
        rigaNotaSelezionata = id;
        document.getElementById("notaEditor").value = nota || "";
        document.getElementById("notaModal").style.display = "flex";
    }

    async function salvaNota() {
        const nuovaNota = document.getElementById("notaEditor").value;

        await db
            .from("ordine_dettaglio")
            .update({ nota: nuovaNota })
            .eq("id", rigaNotaSelezionata);

        chiudiNota();
        loadDettaglio();
    }

    function chiudiNota() {
        document.getElementById("notaModal").style.display = "none";
    }


    function evidenziaRiga(trSel) {
        document.querySelectorAll("#table_dettaglio tbody tr").forEach(tr => {
            tr.classList.remove("selezionata");
        });
        trSel.classList.add("selezionata");
    }

    async function updatePrezzo(id, value) {
        const prezzo = parseFloat(value.replace(",", "."));

        if (isNaN(prezzo) || prezzo < 0) {
            alert("Prezzo non valido");
            loadDettaglio();
            return;
        }

        await db.from("ordine_dettaglio")
            .update({ prezzo })
            .eq("id", id);

        loadDettaglio();
    }

    async function togglePreparato(id, currentValue) {
        const newValue = !currentValue;
        await db.from("ordine_dettaglio").update({ preparato: newValue }).eq("id", id);
        
        //Aggiorno stato ordine
        const { data: dettagli_ordine } = await db
                .from("ordine_dettaglio")
                .select("preparato")
                .eq("ordineid", ordineID)
        loadDettaglio();
    }

    async function toggleConsegnato(id, currentValue) {
        const newValue = !currentValue;
        if(newValue == true)
            await db.from("ordine_dettaglio").update({ preparato: newValue }).eq("id", id);
        await db.from("ordine_dettaglio").update({ consegnato: newValue }).eq("id", id);

        loadDettaglio();
    }

    /*async function togglePagato(id, currentValue, colorazioneid, prezzo) {
        const newValue = !currentValue;
        await db.from("ordine_dettaglio").update({ pagato: newValue }).eq("id", id);

        if (newValue === true) {
            // ✔ CONSEGNATO → INSERISCO VENDITA
            await inserisciVendita(colorazioneid, prezzo);
        } else {
            // ✘ NON CONSEGNATO → RIMUOVO L'ULTIMA VENDITA
            await rimuoviVendita(colorazioneid, prezzo);
        }           
        loadDettaglio();
    }*/

    async function togglePagato(id, currentValue, colorazioneid, prezzo) {
        const newValue = !currentValue;

        // 1️⃣ Aggiorno il dettaglio
        await db
            .from("ordine_dettaglio")
            .update({ pagato: newValue })
            .eq("id", id);

        // 2️⃣ Gestione vendite
        if (newValue === true) {
            await inserisciVendita(colorazioneid, prezzo);
        } else {
            await rimuoviVendita(colorazioneid, prezzo);
        }

        // 3️⃣ Controllo se TUTTI i dettagli dell’ordine sono pagati
        const { data: dettagli, error } = await db
            .from("ordine_dettaglio")
            .select("pagato")
            .eq("ordineid", ordineID);

        if (error) {
            console.error("Errore nel recupero dettagli ordine:", error);
            return;
        }

        // Verifico se tutti sono pagati
        const tuttiPagati = dettagli.every(d => d.pagato === true);
        
        // 4️⃣ Aggiorno la tabella ordini
        await db
            .from("ordini")
            .update({ pagato: tuttiPagati })
            .eq("id", ordineID);

        // 5️⃣ Ricarico la UI
        loadDettaglio();
    }


    async function checkStatoOrdine(){
        //Aggiorno stato ordine
        const { data: dettagli_ordine } = await db
                .from("ordine_dettaglio")
                .select("preparato,consegnato,pagato")
                .eq("ordineid", ordineID)

        // Verifica se TUTTI sono true 
        const tuttiConsegnati = dettagli_ordine.every(r => r.consegnato === true)
        if (tuttiConsegnati == true)
            await db.from("ordini").update({ stato: "CONSEGNATO" }).eq("id", ordineID);
        else
        {
            // Verifica se TUTTI sono true 
            const tuttiPreparati = dettagli_ordine.every(r => r.preparato === true)
            if (tuttiPreparati == true)
                await db.from("ordini").update({ stato: "PREPARATO" }).eq("id", ordineID);
            else
                await db.from("ordini").update({ stato: "IN LAVORAZIONE" }).eq("id", ordineID);
        }

        const tuttiPagati = dettagli_ordine.every(r => r.pagato === true)
        if (tuttiPagati == true)
            await db.from("ordini").update({ pagato: true }).eq("id", ordineID);
        else
            await db.from("ordini").update({ pagato: false }).eq("id", ordineID);
    }

    async function inserisciVendita(colorazioneid, prezzo) {
        const now = new Date().toISOString();

        await db.from("vendite").insert([
            {
                colorazioneid,
                prezzo,
                data: now,
                destinatario: destinatarioOrdine
            }
        ]);
        await muoviMagazzino(db, colorazioneid, -1);
    }

    async function rimuoviVendita(colorazioneid, prezzo) {
        // Trova la vendita più recente
        const { data } = await db
            .from("vendite")
            .select("*")
            .eq("colorazioneid", colorazioneid)
            .eq("destinatario", destinatarioOrdine)
            .eq("prezzo", prezzo)
            .order("data", { ascending: false })
            .limit(1);

        if (data && data.length > 0) {
            await db.from("vendite").delete().eq("id", data[0].id);
            await muoviMagazzino(db, colorazioneid, 1);
        }
    }

    function aggiungiRiga() {
        window.location.href = "page_aggiungi_dettaglio_ordine.html?id=" + ordineID;
    }

    async function eliminaRiga() {
        if (!selezionata) {
            alert("Seleziona una riga");
            return;
        }
        if (!confirm("Vuoi eliminare questa riga dall'ordine?")) return;
        await db.from("ordine_dettaglio").delete().eq("id", selezionata.id);
        selezionata = null;
        loadDettaglio();
    }

    function indietro() {
        window.location.href = "page_ordini.html";
    }
</script>


</body>
</html>
