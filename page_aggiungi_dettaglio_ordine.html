<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aggiungi prodotti · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="app-header">
    <button class="icon-btn" onclick="annulla()" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Aggiungi prodotti</h1>
    <button class="header-link" onclick="aggiungidettaglioordine2()">Inserisci a mano</button>
</header>
<main class="page">
    <div class="filters">
        <select id="filtro_prodotto" onchange="filterProdotti()"><option value="">Prodotto</option></select>
        <select id="filtro_tipologia" onchange="filterProdotti()"><option value="">Tipologia</option></select>
        <select id="filtro_tema" onchange="filterProdotti()"><option value="">Tema</option></select>
        <input type="text" id="filtro_descrizione" placeholder="Cerca..." oninput="filterProdotti()">
    </div>
    <p class="hint">Scegli il colore toccando la foto, poi premi + per aggiungerlo all'ordine.</p>
    <div class="table-wrap picker" id="tabellaProdottiContainer"><p>Caricamento…</p></div>

    <div class="cart-head"><p class="section-label">Da aggiungere all'ordine</p></div>
    <div class="cart" id="carrelloContainer">
        <p>Carrello vuoto</p>
    </div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-secondary" onclick="annulla()">Annulla</button>
        <button class="btn btn-primary" onclick="confermaDettaglioOrdine()">Conferma</button>
    </div>
</footer>
    <script>
        const client = supabase.createClient("https://ixarnqyrsonhshkctcki.supabase.co", "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ");
        const urlParams = new URLSearchParams(window.location.search);
        const ordineID = urlParams.get("id");

        let prodottiCache = [], tutteLeColorazioni = [], carrello = [];

        window.onload = async () => {
            await loadFiltri();
            await caricaProdotti();
        };

        async function loadFiltri() {
            const fetchFilter = (table) => client.from(table).select("codice").order("codice");
            const [p, ti, te] = await Promise.all([fetchFilter("sigla_prodotto"), fetchFilter("sigla_tipologia"), fetchFilter("sigla_tema")]);
            
            const fill = (el, data) => data?.forEach(i => el.innerHTML += `<option value="${i.codice}">${i.codice}</option>`);
            fill(document.getElementById("filtro_prodotto"), p.data);
            fill(document.getElementById("filtro_tipologia"), ti.data);
            fill(document.getElementById("filtro_tema"), te.data);
        }

        async function caricaProdotti() {
            const { data: p } = await client.from("prodotti").select("*").order("id");
            const { data: c } = await client.from("colorazioni").select("*");
            prodottiCache = p;
            tutteLeColorazioni = c;
            renderProdotti();
        }

        function filterProdotti() { renderProdotti(); }

        function renderProdotti() {
            const fP = document.getElementById("filtro_prodotto").value;
            const fTi = document.getElementById("filtro_tipologia").value;
            const fTe = document.getElementById("filtro_tema").value;
            const fD = document.getElementById("filtro_descrizione").value.toLowerCase();

            const filtrati = prodottiCache.filter(p => 
                (!fP || p.prodotto === fP) && (!fTi || p.tipologia === fTi) && 
                (!fTe || p.tema === fTe) && (!fD || (p.descrizione || "").toLowerCase().includes(fD))
            );

            let html = `<table><thead><tr><th style="width:40%">Info</th><th style="width:40%">Colore</th><th style="width:20%">+</th></tr></thead><tbody>`;
            
            filtrati.forEach(p => {
                const colori = tutteLeColorazioni.filter(c => c.prodottoid === p.id);
                html += `
                <tr data-id="${p.id}">
                    <td style="font-size:13px; text-align:left;"><b>${p.prodotto}</b><br><small>${p.descrizione || ''}</small></td>
                    <td>
                        <div class="color-select-display" onclick="toggleColorMenu('${p.id}')">
                            <img id="preview-${p.id}" src="${colori[0]?.percorsoimmagine || ''}" data-idcol="${colori[0]?.id || ''}">
                        </div>
                        <div class="color-select-options" id="options-${p.id}">
                            ${colori.map(c => `<img src="${c.percorsoimmagine}" onclick="selezionaColorazione('${p.id}','${c.percorsoimmagine}','${c.id}')">`).join('')}
                        </div>
                    </td>
                    <td><button class="btn-add" onclick="aggiungiAlCarrello('${p.id}')">+</button></td>
                </tr>`;
            });
            document.getElementById("tabellaProdottiContainer").innerHTML = html + `</tbody></table>`;
        }

        function toggleColorMenu(id) {
            const menu = document.getElementById(`options-${id}`);
            const riga = document.querySelector(`tr[data-id="${id}"]`);
            const isOpen = menu.style.display === "flex";

            document.querySelectorAll(".color-select-options").forEach(m => m.style.display = "none");
            document.querySelectorAll("tr").forEach(r => r.classList.remove("row-open"));

            if (!isOpen) {
                menu.style.display = "flex";
                riga.classList.add("row-open");
            }
        }

        function selezionaColorazione(id, path, idCol) {
            const img = document.getElementById(`preview-${id}`);
            img.src = path;
            img.dataset.idcol = idCol;
            // Chiudi menu
            document.getElementById(`options-${id}`).style.display = "none";
            document.querySelector(`tr[data-id="${id}"]`).classList.remove("row-open");
        }

        function aggiungiAlCarrello(id) {
            const p = prodottiCache.find(x => x.id == id);
            const colImg = document.getElementById(`preview-${id}`);
            const idCol = colImg.dataset.idcol;

            if (!idCol) return alert("Seleziona una colorazione");

            const exist = carrello.find(c => c.idCol === idCol);
            if (exist) {
                exist.qta++;
            } else {
                carrello.push({ 
                    id, 
                    idCol, 
                    img: colImg.src, 
                    nome: p.prodotto, 
                    prezzo: p.prezzo || 0, 
                    qta: 1 
                });
            }
            aggiornaCarrello();
        }

        function aggiornaCarrello() {
            const cont = document.getElementById("carrelloContainer");
            if (!carrello.length) return cont.innerHTML = "<p style='text-align:center'>Carrello vuoto</p>";

            let h = `<table style="font-size:14px"><thead><tr><th>Img</th><th>Prezzo</th><th>Q.ta</th><th>X</th></tr></thead><tbody>`;
            carrello.forEach((c, i) => {
                h += `<tr>
                    <td><img src="${c.img}" style="width:50px; height:40px; object-fit:contain;"></td>
                    <td><input type="number" value="${c.prezzo}" step="0.01" onchange="carrello[${i}].prezzo=parseFloat(this.value)"></td>
                    <td><input type="number" value="${c.qta}" onchange="carrello[${i}].qta=parseInt(this.value)"></td>
                    <td><button class="btn-annulla" onclick="carrello.splice(${i},1);aggiornaCarrello()">X</button></td>
                </tr>`;
            });
            cont.innerHTML = h + `</tbody></table>`;
        }

        async function confermaDettaglioOrdine() {
            if (!carrello.length) return alert("Carrello vuoto");

            const righe = [];
            carrello.forEach(item => {
                for(let i=0; i<item.qta; i++) {
                    righe.push({
                        ordineid: ordineID,
                        colorazioneid: item.idCol,
                        prezzo: item.prezzo,
                        preparato: false,
                        consegnato: false
                    });
                }
            });

            const { error } = await client.from("ordine_dettaglio").insert(righe);
            if (error) {
                alert("Errore salvataggio");
            } else {
                window.location.href = "page_ordine_dettaglio.html?id=" + ordineID;
            }
        }

        function annulla() { window.location.href = "page_ordine_dettaglio.html?id=" + ordineID; }
        function aggiungidettaglioordine2() { window.location.href = "page_aggiungi_dettaglio_ordine_2.html?id=" + ordineID; }

        // Chiudi menu se clicchi fuori
        document.addEventListener("click", e => {
            if (!e.target.closest('.color-select-display') && !e.target.closest('.color-select-options')) {
                document.querySelectorAll(".color-select-options").forEach(m => m.style.display = "none");
                document.querySelectorAll("tr").forEach(r => r.classList.remove("row-open"));
            }
        });
    </script>
</body>
</html>
