<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Aggiungi Dettaglio Ordine</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- STILE GENERALE --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111;
            color: #f5f5f5;
        }

        /* --- TOPBAR --- */
        .topbar {
            width: 100%;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
            padding: 16px 0;
        }
        .topbar .topbar-button {
            display: block;
            width: 80%;
            height: 80px;
            border-radius: 8px;
            border: none;
            font-size: 38px;
            text-align: center;
            cursor: pointer;
            background: #333;
            color: white;
            margin: 0 auto;
        }

        .titolo-pagina {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin: 12px 0;
            color: white;
        }

        /* --- FILTRI --- */
        .filters {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }
        .filters select, .filters input {
            height: 45px;
            font-size: 16px;
            padding: 5px;
            border-radius: 6px;
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        /* --- SEZIONI --- */
        .section-prodotti { flex: 0 0 45%; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
        .section-carrello { flex: 0 0 25%; overflow-y: auto; display: flex; flex-direction: column; background: #1a1a1a; }
        .section-bottoni { flex: 0 0 10%; display: flex; align-items: center; justify-content: center; gap: 20px; padding: 10px; }

        .scroll-box {
            flex: 1;
            width: 95%;
            margin: auto;
            background: #222;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #333;
        }

        /* --- TABELLE (FIX Z-INDEX) --- */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; vertical-align: middle; position: relative; }
        thead th { position: sticky; top: 0; background: #333; z-index: 10; }

        /* TRUCCO PER RIGHE: Elevazione dinamica */
        tr.row-open { 
            z-index: 9999 !important; 
            position: relative; 
            background: #2a2a2a !important;
        }

        /* --- COLOR SELECTOR --- */
        .color-select-display {
            width: 100%;
            height: 70px;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            overflow: hidden;
        }
        .color-select-display img { width: 100%; height: 100%; object-fit: contain; }

        .color-select-options {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            max-height: 220px;
            overflow-y: auto;
            background: #333;
            border: 2px solid #5cb85c;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
            z-index: 10000 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .color-select-options img { width: 100%; height: auto; border-radius: 4px; cursor: pointer; border: 1px solid #444; }

        /* --- BOTTONI --- */
        .btn-add { background: #5cb85c; color: white; border: none; width: 100%; height: 60px; font-size: 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .section-bottoni button { width: 45%; height: 60px; font-size: 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-conferma { background: #5cb85c; color: white; }
        .btn-annulla { background: #d9534f; color: white; }

        @media (max-width: 768px) {
            .filters { grid-template-columns: 1fr 1fr; }
            .section-bottoni button { height: 50px; font-size: 16px; }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <button class="topbar-button" onclick="aggiungidettaglioordine2()">&#8594;</button>
    </div>

    <div class="titolo-pagina">Aggiungi Dettaglio Ordine</div>

    <div class="filters">
        <select id="filtro_prodotto" onchange="filterProdotti()"><option value="">Prodotto</option></select>
        <select id="filtro_tipologia" onchange="filterProdotti()"><option value="">Tipologia</option></select>
        <select id="filtro_tema" onchange="filterProdotti()"><option value="">Tema</option></select>
        <input type="text" id="filtro_descrizione" placeholder="Descrizione..." oninput="filterProdotti()">
    </div>

    <div class="section-prodotti">
        <div class="scroll-box" id="tabellaProdottiContainer"></div>
    </div>

    <div class="titolo-pagina" style="font-size: 18px;">Carrello</div>
    <div class="section-carrello">
        <div class="scroll-box" id="carrelloContainer">
            <p style="text-align:center">Carrello vuoto</p>
        </div>
    </div>

    <div class="section-bottoni">
        <button class="btn-conferma" onclick="confermaDettaglioOrdine()">CONFERMA</button>
        <button class="btn-annulla" onclick="annulla()">ANNULLA</button>
    </div>

    <script>
        const client = supabase.createClient("https://ixarnqyrsonhshkctcki.supabase.co", "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ");
        const urlParams = new URLSearchParams(window.location.search);
        const ordineID = urlParams.get("id");

        let prodottiCache = [], tutteLeColorazioni = [], carrello = [];

        window.onload = async () => {
            await loadFiltri();
            await caricaProdotti();
        };

        async function loadFiltri() {
            const fetchFilter = (table) => client.from(table).select("codice").order("codice");
            const [p, ti, te] = await Promise.all([fetchFilter("sigla_prodotto"), fetchFilter("sigla_tipologia"), fetchFilter("sigla_tema")]);
            
            const fill = (el, data) => data?.forEach(i => el.innerHTML += `<option value="${i.codice}">${i.codice}</option>`);
            fill(document.getElementById("filtro_prodotto"), p.data);
            fill(document.getElementById("filtro_tipologia"), ti.data);
            fill(document.getElementById("filtro_tema"), te.data);
        }

        async function caricaProdotti() {
            const { data: p } = await client.from("prodotti").select("*").order("id");
            const { data: c } = await client.from("colorazioni").select("*");
            prodottiCache = p;
            tutteLeColorazioni = c;
            renderProdotti();
        }

        function filterProdotti() { renderProdotti(); }

        function renderProdotti() {
            const fP = document.getElementById("filtro_prodotto").value;
            const fTi = document.getElementById("filtro_tipologia").value;
            const fTe = document.getElementById("filtro_tema").value;
            const fD = document.getElementById("filtro_descrizione").value.toLowerCase();

            const filtrati = prodottiCache.filter(p => 
                (!fP || p.prodotto === fP) && (!fTi || p.tipologia === fTi) && 
                (!fTe || p.tema === fTe) && (!fD || (p.descrizione || "").toLowerCase().includes(fD))
            );

            let html = `<table><thead><tr><th style="width:40%">Info</th><th style="width:40%">Colore</th><th style="width:20%">+</th></tr></thead><tbody>`;
            
            filtrati.forEach(p => {
                const colori = tutteLeColorazioni.filter(c => c.prodottoid === p.id);
                html += `
                <tr data-id="${p.id}">
                    <td style="font-size:13px; text-align:left;"><b>${p.prodotto}</b><br><small>${p.descrizione || ''}</small></td>
                    <td>
                        <div class="color-select-display" onclick="toggleColorMenu('${p.id}')">
                            <img id="preview-${p.id}" src="${colori[0]?.percorsoimmagine || ''}" data-idcol="${colori[0]?.id || ''}">
                        </div>
                        <div class="color-select-options" id="options-${p.id}">
                            ${colori.map(c => `<img src="${c.percorsoimmagine}" onclick="selezionaColorazione('${p.id}','${c.percorsoimmagine}','${c.id}')">`).join('')}
                        </div>
                    </td>
                    <td><button class="btn-add" onclick="aggiungiAlCarrello('${p.id}')">+</button></td>
                </tr>`;
            });
            document.getElementById("tabellaProdottiContainer").innerHTML = html + `</tbody></table>`;
        }

        function toggleColorMenu(id) {
            const menu = document.getElementById(`options-${id}`);
            const riga = document.querySelector(`tr[data-id="${id}"]`);
            const isOpen = menu.style.display === "flex";

            document.querySelectorAll(".color-select-options").forEach(m => m.style.display = "none");
            document.querySelectorAll("tr").forEach(r => r.classList.remove("row-open"));

            if (!isOpen) {
                menu.style.display = "flex";
                riga.classList.add("row-open");
            }
        }

        function selezionaColorazione(id, path, idCol) {
            const img = document.getElementById(`preview-${id}`);
            img.src = path;
            img.dataset.idcol = idCol;
            // Chiudi menu
            document.getElementById(`options-${id}`).style.display = "none";
            document.querySelector(`tr[data-id="${id}"]`).classList.remove("row-open");
        }

        function aggiungiAlCarrello(id) {
            const p = prodottiCache.find(x => x.id == id);
            const colImg = document.getElementById(`preview-${id}`);
            const idCol = colImg.dataset.idcol;

            if (!idCol) return alert("Seleziona una colorazione");

            const exist = carrello.find(c => c.idCol === idCol);
            if (exist) {
                exist.qta++;
            } else {
                carrello.push({ 
                    id, 
                    idCol, 
                    img: colImg.src, 
                    nome: p.prodotto, 
                    prezzo: p.prezzo || 0, 
                    qta: 1 
                });
            }
            aggiornaCarrello();
        }

        function aggiornaCarrello() {
            const cont = document.getElementById("carrelloContainer");
            if (!carrello.length) return cont.innerHTML = "<p style='text-align:center'>Carrello vuoto</p>";

            let h = `<table style="font-size:14px"><thead><tr><th>Img</th><th>Prezzo</th><th>Q.ta</th><th>X</th></tr></thead><tbody>`;
            carrello.forEach((c, i) => {
                h += `<tr>
                    <td><img src="${c.img}" style="width:50px; height:40px; object-fit:contain;"></td>
                    <td><input type="number" value="${c.prezzo}" step="0.01" onchange="carrello[${i}].prezzo=parseFloat(this.value)" style="width:60px; background:#111; color:white; border:1px solid #444;"></td>
                    <td><input type="number" value="${c.qta}" onchange="carrello[${i}].qta=parseInt(this.value)" style="width:40px; background:#111; color:white; border:1px solid #444;"></td>
                    <td><button class="btn-annulla" style="width:30px; height:30px; padding:0;" onclick="carrello.splice(${i},1);aggiornaCarrello()">X</button></td>
                </tr>`;
            });
            cont.innerHTML = h + `</tbody></table>`;
        }

        async function confermaDettaglioOrdine() {
            if (!carrello.length) return alert("Carrello vuoto");

            const righe = [];
            carrello.forEach(item => {
                for(let i=0; i<item.qta; i++) {
                    righe.push({
                        ordineid: ordineID,
                        colorazioneid: item.idCol,
                        prezzo: item.prezzo,
                        preparato: false,
                        consegnato: false
                    });
                }
            });

            const { error } = await client.from("ordine_dettaglio").insert(righe);
            if (error) {
                alert("Errore salvataggio");
            } else {
                window.location.href = "page_ordine_dettaglio.html?id=" + ordineID;
            }
        }

        function annulla() { window.location.href = "page_ordine_dettaglio.html?id=" + ordineID; }
        function aggiungidettaglioordine2() { window.location.href = "page_aggiungi_dettaglio_ordine_2.html?id=" + ordineID; }

        // Chiudi menu se clicchi fuori
        document.addEventListener("click", e => {
            if (!e.target.closest('.color-select-display') && !e.target.closest('.color-select-options')) {
                document.querySelectorAll(".color-select-options").forEach(m => m.style.display = "none");
                document.querySelectorAll("tr").forEach(r => r.classList.remove("row-open"));
            }
        });
    </script>
</body>
</html>
