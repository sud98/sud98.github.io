<!DOCTYPE html>
<html>
<head>          
    <meta charset="utf-8" />
    <title>Resoconto Economico</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            flex: 0 0 7%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .section-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px;
        }

        .box {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 17px;
            box-sizing: border-box;
        }

        .back-button {
            position: fixed;
            top: 15px;
            left: 15px;
            font-size: 28px;
            font-weight: bold;
            background: #1b1b1b;
            color: #5bc0de;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            z-index: 999;
            transition: 0.2s;
        }

        .back-button:hover {
            background: #2a2a2a;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="back-button" onclick="window.location.href = 'index.html'">←</div>

    <div class="section-title">
        <h1>Resoconto Economico</h1>
    </div>

    <div class="section-content">

        <div class="box">
            <label>TOTALE ACQUISTI</label>
            <input id="TXT_TotaleAcquisti" readonly>
        </div>

        <div class="box">
            <label>TOTALE VENDITE</label>
            <input id="TXT_TotaleVendite" readonly>
        </div>

        <div class="box">
            <label>DELTA</label>
            <input id="TXT_Delta" readonly>
        </div>

        <div class="box">
            <canvas id="graficoDelta"></canvas>
        </div>

    </div>

<script>
    const client = supabase.createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    async function calcoloDatiTabella() {

        const dataIniziale = new Date("2025-07-29");
        const oggi = new Date();

        // --- 1. Leggo le tabelle ---
        const { data: acquisti } = await client.from("acquisti").select("*");
        const { data: vendite } = await client.from("vendite").select("*");

        let totaleAcquisti = 0;
        let totaleVendite = 0;
        let delta = 0;

        let puntiGrafico = [];

        // --- 2. Ciclo giorno per giorno ---
        for (let giorno = new Date(dataIniziale); giorno < oggi; giorno.setDate(giorno.getDate() + 1)) {

            const giornoISO = giorno.toISOString().split("T")[0];

            const speseGiornaliere = acquisti
                .filter(r => r.data.startsWith(giornoISO))
                .reduce((sum, r) => sum + r.prezzo, 0);

            const venditeGiornaliere = vendite
                .filter(r => r.data.startsWith(giornoISO))
                .reduce((sum, r) => sum + r.prezzo, 0);

            totaleAcquisti += speseGiornaliere;
            totaleVendite += venditeGiornaliere;

            delta = totaleVendite - totaleAcquisti;

            puntiGrafico.push({ x: giornoISO, y: delta });
        }

        // --- 3. Aggiorno UI ---
        document.getElementById("TXT_TotaleAcquisti").value = totaleAcquisti.toFixed(2);
        document.getElementById("TXT_TotaleVendite").value = totaleVendite.toFixed(2);
        document.getElementById("TXT_Delta").value = delta.toFixed(2);

        // --- 4. Disegno grafico ---
        disegnaGrafico(puntiGrafico);
    }

    function disegnaGrafico(punti) {
        const ctx = document.getElementById("graficoDelta");

        new Chart(ctx, {
            type: "line",
            data: {
                datasets: [{
                    label: "Delta",
                    data: punti,
                    borderColor: "#5cb85c",
                    backgroundColor: "rgba(92,184,92,0.3)",
                    tension: 0.2
                }]
            },
            options: {
                scales: {
                    x: { type: "time", time: { unit: "day" } },
                    y: { beginAtZero: false }
                }
            }
        });
    }

    window.onload = calcoloDatiTabella;
</script>

</body>
</html>
