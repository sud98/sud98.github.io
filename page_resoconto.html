<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Resoconto · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
<header class="app-header">
    <a class="icon-btn" href="index.html" aria-label="Torna alla home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Resoconto</h1>
</header>
<main class="page">
    <div class="stats">
        <div class="card stat">
            <label for="TXT_TotaleAcquisti">Acquisti €</label>
            <input id="TXT_TotaleAcquisti" readonly value="…">
        </div>
        <div class="card stat">
            <label for="TXT_TotaleVendite">Vendite €</label>
            <input id="TXT_TotaleVendite" readonly value="…">
        </div>
        <div class="card stat stat-delta">
            <label for="TXT_Delta">Guadagno €</label>
            <input id="TXT_Delta" readonly value="…">
        </div>
    </div>
    <p class="section-label">Andamento del guadagno</p>
    <div class="card chart-card">
        <canvas id="graficoDelta"></canvas>
    </div>
</main>
<script>
    const client = supabase.createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    async function calcoloDatiTabella() {

        const dataIniziale = new Date("2025-07-29");
        const oggi = new Date();

        // --- 1. Leggo le tabelle ---
        const { data: acquisti } = await client.from("acquisti").select("*");
        const { data: vendite } = await client.from("vendite").select("*");

        let totaleAcquisti = 0;
        let totaleVendite = 0;
        let delta = 0;

        let puntiGrafico = [];

        // --- 2. Ciclo giorno per giorno ---
        for (let giorno = new Date(dataIniziale); giorno < oggi; giorno.setDate(giorno.getDate() + 1)) {

            const giornoISO = giorno.toISOString().split("T")[0];

            const speseGiornaliere = acquisti
                .filter(r => r.data.startsWith(giornoISO))
                .reduce((sum, r) => sum + r.prezzo, 0);

            const venditeGiornaliere = vendite
                .filter(r => r.data.startsWith(giornoISO))
                .reduce((sum, r) => sum + r.prezzo, 0);

            totaleAcquisti += speseGiornaliere;
            totaleVendite += venditeGiornaliere;

            delta = totaleVendite - totaleAcquisti;

            puntiGrafico.push({ x: giornoISO, y: delta });
        }

        // --- 3. Aggiorno UI ---
        document.getElementById("TXT_TotaleAcquisti").value = totaleAcquisti.toFixed(2);
        document.getElementById("TXT_TotaleVendite").value = totaleVendite.toFixed(2);
        document.getElementById("TXT_Delta").value = delta.toFixed(2);

        // --- 4. Disegno grafico ---
        disegnaGrafico(puntiGrafico);
    }

    function disegnaGrafico(punti) {
        const ctx = document.getElementById("graficoDelta");

        new Chart(ctx, {
            type: "line",
            data: {
                datasets: [{
                    label: "Delta",
                    data: punti,
                    borderColor: "#5cb85c",
                    backgroundColor: "rgba(92,184,92,0.3)",
                    tension: 0.2
                }]
            },
            options: {
                scales: {
                    x: { type: "time", time: { unit: "day" } },
                    y: { beginAtZero: false }
                }
            }
        });
    }

    window.onload = calcoloDatiTabella;
</script>

</body>
</html>
