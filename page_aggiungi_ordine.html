<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuovo ordine · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="app-header">
    <button class="icon-btn" onclick="indietro()" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Nuovo ordine</h1>
</header>
<main class="page page-narrow">
    <form class="card card-pad form" onsubmit="return false">
        <div class="field">
            <label for="destinatario">Destinatario</label>
            <input type="text" id="destinatario" placeholder="Nome e cognome" autocomplete="off">
        </div>
        <div class="field-row">
            <div class="field">
                <label for="creazione">Data ordine</label>
                <input type="date" id="creazione">
            </div>
            <div class="field">
                <label for="scadenza">Consegna entro</label>
                <input type="date" id="scadenza">
            </div>
        </div>
    </form>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-secondary" onclick="indietro()">Annulla</button>
        <button class="btn btn-primary" onclick="salvaOrdine()">Salva ordine</button>
    </div>
</footer>
<script>
    const { createClient } = supabase;

    const db = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    document.addEventListener("DOMContentLoaded", function () {
        const oggi = new Date().toISOString().split("T")[0];
        document.getElementById("creazione").value = oggi;
    });

    async function salvaOrdine() {
        const destinatario = document.getElementById("destinatario").value.trim();
        const scadenza = document.getElementById("scadenza").value;
        const creazione = document.getElementById("creazione").value;
        const stato = "IN LAVORAZIONE"
        const pagato = false

        if (!destinatario || !scadenza) {
            alert("Compila tutti i campi");
            return;
        }

        const { error } = await db
            .from("ordini")
            .insert([{ destinatario, scadenza_consegna: scadenza, data_creazione:creazione, stato, pagato }]);

        if (error) {
            alert("Errore salvando ordine: " + error.message);
            return;
        }

        const { data: ordine} = await db
            .from("ordini")
            .select("id")
            .eq("destinatario", destinatario)
            .eq("scadenza_consegna", scadenza)
            .eq("data_creazione", creazione)
            .single();

        window.location.href = "page_ordine_dettaglio.html?id=" + ordine.id;
    }

    function indietro() {
        window.history.back();
    }
</script>

</body>
</html>
