<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vendite · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <a class="icon-btn" href="index.html" aria-label="Torna alla home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Vendite</h1>
</header>
<main class="page">
    <p class="hint">Tocca una vendita per selezionarla.</p>
    <div class="table-wrap" id="tabella"><p>Caricamento…</p></div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaRiga()">Elimina</button>
        <button class="btn btn-primary" onclick="vaiAggiungi()">+ Nuova vendita</button>
    </div>
</footer>
    <script>
        const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
        );

        let rigaSelezionata = null;

        async function caricaTabella() {
            const { data: vendite } =
                await client.from("vendite").select("*").order("data", { ascending: false });

            const { data: colorazioni } =
                await client.from("colorazioni").select("*");

            if (!vendite || !colorazioni) {
                document.getElementById("tabella").innerHTML = "<p>Errore nel caricamento</p>";
                return;
            }

            const mappaColorazioni = {};
            for (const c of colorazioni) {
                if (!mappaColorazioni[c.id]) mappaColorazioni[c.id] = [];
                mappaColorazioni[c.id].push(c.percorsoimmagine);
            }

            document.getElementById("tabella").innerHTML =
                generaHTMLTabella(vendite, mappaColorazioni);
        }

        function generaHTMLTabella(dati, mappaColorazioni) {
            if (!dati.length) return "<p>Nessun dato trovato.</p>";

            // Una riga compatta per vendita: foto | prodotto, destinatario, data | prezzo
            let html = `<table class="sales"><thead><tr><th>Foto</th><th>Vendita</th><th class="num">Prezzo</th></tr></thead><tbody>`;

            for (const riga of dati) {
                const imgs = mappaColorazioni[riga.colorazioneid] || [];
                const foto = imgs.length
                    ? imgs.map(src => `<img src="${src}" alt="" loading="lazy">`).join("")
                    : `<div class="no-img"></div>`;
                const soloData = new Date(riga.data).toLocaleDateString("it-IT");
                const prezzo = Number(riga.prezzo ?? 0).toFixed(2);

                html += `<tr onclick="selezionaRiga(this)" data-id="${riga.id}">
                    <td class="foto">${foto}</td>
                    <td class="info">
                        <div class="titolo">${riga.colorazioneid ?? ""}</div>
                        <div class="sub dest">${riga.destinatario ?? ""}</div>
                        <div class="sub">${soloData}</div>
                    </td>
                    <td class="num prezzo">€ ${prezzo}</td>
                </tr>`;
            }

            html += "</tbody></table>";
            return html;
        }

        function selezionaRiga(tr) {
            document.querySelectorAll("tr").forEach(r => r.classList.remove("selezionata"));
            tr.classList.add("selezionata");

            rigaSelezionata = Number(tr.dataset.id);
            console.log("ID selezionato:", rigaSelezionata);
        }


        async function eliminaRiga() {
            console.log(rigaSelezionata);
            if (!rigaSelezionata) {
                alert("Seleziona una riga prima di eliminare.");
                return;
            }
            if (!confirm("Vuoi eliminare la riga selezionata?")) return;
            
            
            const { error } = await client
                .from("vendite")
                .delete()
                .eq("id", rigaSelezionata);

            if (error) {
                alert("Errore durante l'eliminazione.");
                return;
            }

            alert("Riga eliminata.");
            rigaSelezionata = null;
            caricaTabella();
        }

        function vaiAggiungi() {
            window.location.href = "page_aggiungi_vendita.html";
        }

        window.onload = caricaTabella;
    </script>

</body>
</html>
