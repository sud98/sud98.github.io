<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vendite · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <a class="icon-btn" href="index.html" aria-label="Torna alla home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Vendite</h1>
</header>
<main class="page">
    <div class="filters">
        <select id="filtro_prodotto" onchange="mostraTabella()">
            <option value="">Tutti i prodotti</option>
        </select>
        <select id="filtro_tipologia" onchange="mostraTabella()">
            <option value="">Tutte le tipologie</option>
        </select>
        <select id="filtro_tema" onchange="mostraTabella()">
            <option value="">Tutti i temi</option>
        </select>
        <input type="text" id="filtro_testo" placeholder="Cerca..." oninput="mostraTabella()">
    </div>
    <p class="hint" id="riepilogo">Tocca una vendita per selezionarla.</p>
    <div class="table-wrap" id="tabella"><p>Caricamento…</p></div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaRiga()">Elimina</button>
        <button class="btn btn-primary" onclick="vaiAggiungi()">+ Nuova vendita</button>
    </div>
</footer>
    <script>
        const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
        );

        let rigaSelezionata = null;
        let vendite = [];
        let mappaColorazioni = {};      // colorazioneid -> [foto]
        let infoColore = {};            // colorazioneid -> { prodotto, tipologia, tema, testo }

        // Supabase restituisce al massimo 1000 righe per volta: leggo a blocchi
        async function leggiVendite() {
            const tutte = [];
            for (let da = 0; ; da += 1000) {
                const { data, error } = await client
                    .from("vendite")
                    .select("*")
                    .order("data", { ascending: false })
                    .order("id", { ascending: false })
                    .range(da, da + 999);
                if (error) throw error;
                tutte.push(...data);
                if (data.length < 1000) return tutte;
            }
        }

        async function caricaTabella() {
            try {
                const [lette, { data: colorazioni, error: e1 }, { data: prodotti, error: e2 }] = await Promise.all([
                    leggiVendite(),
                    client.from("colorazioni").select("*"),
                    client.from("prodotti").select("id, prodotto, tipologia, tema, descrizione")
                ]);
                if (e1 || e2) throw e1 || e2;
                vendite = lette;

                const prodottoDa = {};
                for (const p of prodotti) prodottoDa[p.id] = p;

                mappaColorazioni = {};
                infoColore = {};
                for (const c of colorazioni) {
                    if (!mappaColorazioni[c.id]) mappaColorazioni[c.id] = [];
                    mappaColorazioni[c.id].push(c.percorsoimmagine);
                    const p = prodottoDa[c.prodottoid] || {};
                    infoColore[c.id] = {
                        prodotto: p.prodotto, tipologia: p.tipologia, tema: p.tema,
                        testo: [p.descrizione, c.descrizione].filter(Boolean).join(" ")
                    };
                }
                // Anche le vendite di colori eliminati hanno il prodotto nel codice
                for (const v of vendite) {
                    const id = v.colorazioneid || "";
                    if (!infoColore[id] && prodottoDa[id.split("_")[0]]) {
                        const p = prodottoDa[id.split("_")[0]];
                        infoColore[id] = { prodotto: p.prodotto, tipologia: p.tipologia, tema: p.tema, testo: p.descrizione || "" };
                    }
                }

                riempiFiltro("filtro_prodotto", prodotti.map(p => p.prodotto));
                riempiFiltro("filtro_tipologia", prodotti.map(p => p.tipologia));
                riempiFiltro("filtro_tema", prodotti.map(p => p.tema));
                mostraTabella();
            } catch (e) {
                console.error(e);
                document.getElementById("tabella").innerHTML = "<p>Errore nel caricamento</p>";
            }
        }

        function riempiFiltro(id, valori) {
            const sel = document.getElementById(id);
            sel.length = 1;
            [...new Set(valori.filter(Boolean))].sort((a, b) => a.localeCompare(b, "it")).forEach(v => {
                const opt = document.createElement("option");
                opt.value = v;
                opt.textContent = v;
                sel.appendChild(opt);
            });
        }

        function mostraTabella() {
            const fProd = document.getElementById("filtro_prodotto").value;
            const fTip  = document.getElementById("filtro_tipologia").value;
            const fTema = document.getElementById("filtro_tema").value;
            const fTesto = document.getElementById("filtro_testo").value.trim().toLowerCase();

            const lista = vendite.filter(v => {
                const info = infoColore[v.colorazioneid] || {};
                if (fProd && info.prodotto !== fProd) return false;
                if (fTip  && info.tipologia !== fTip) return false;
                if (fTema && info.tema !== fTema) return false;
                if (fTesto && ![v.colorazioneid, v.destinatario, info.testo]
                        .some(t => (t || "").toLowerCase().includes(fTesto))) return false;
                return true;
            });

            const totale = lista.reduce((s, v) => s + Number(v.prezzo || 0), 0);
            document.getElementById("riepilogo").textContent =
                `${lista.length} ${lista.length === 1 ? "vendita" : "vendite"} · € ${totale.toFixed(2)}. Tocca una vendita per selezionarla.`;

            document.getElementById("tabella").innerHTML = generaHTMLTabella(lista, mappaColorazioni);
            rigaSelezionata = null;
        }

        function generaHTMLTabella(dati, mappaColorazioni) {
            if (!dati.length) return "<p>Nessun dato trovato.</p>";

            // Una riga compatta per vendita: foto | prodotto, destinatario, data | prezzo
            let html = `<table class="sales"><thead><tr><th>Foto</th><th>Vendita</th><th class="num">Prezzo</th></tr></thead><tbody>`;

            for (const riga of dati) {
                const imgs = mappaColorazioni[riga.colorazioneid] || [];
                const foto = imgs.length
                    ? imgs.map(src => `<img src="${src}" alt="" loading="lazy">`).join("")
                    : `<div class="no-img"></div>`;
                const soloData = new Date(riga.data).toLocaleDateString("it-IT");
                const prezzo = Number(riga.prezzo ?? 0).toFixed(2);

                html += `<tr onclick="selezionaRiga(this)" data-id="${riga.id}">
                    <td class="foto">${foto}</td>
                    <td class="info">
                        <div class="titolo">${riga.colorazioneid ?? ""}</div>
                        <div class="sub dest">${riga.destinatario ?? ""}</div>
                        <div class="sub">${soloData}</div>
                    </td>
                    <td class="num prezzo">€ ${prezzo}</td>
                </tr>`;
            }

            html += "</tbody></table>";
            return html;
        }

        function selezionaRiga(tr) {
            document.querySelectorAll("tr").forEach(r => r.classList.remove("selezionata"));
            tr.classList.add("selezionata");

            rigaSelezionata = Number(tr.dataset.id);
        }


        async function eliminaRiga() {
            if (!rigaSelezionata) {
                alert("Seleziona una riga prima di eliminare.");
                return;
            }
            if (!confirm("Vuoi eliminare la riga selezionata?")) return;
            
            
            const { data: vendita } = await client
                .from("vendite")
                .select("colorazioneid")
                .eq("id", rigaSelezionata)
                .maybeSingle();

            const { error } = await client
                .from("vendite")
                .delete()
                .eq("id", rigaSelezionata);

            if (error) {
                alert("Errore durante l'eliminazione.");
                return;
            }

            // Vendita annullata: il pezzo torna in magazzino
            if (vendita) await muoviMagazzino(client, vendita.colorazioneid, 1);

            alert("Riga eliminata.");
            rigaSelezionata = null;
            caricaTabella();
        }

        function vaiAggiungi() {
            window.location.href = "page_aggiungi_vendita.html";
        }

        window.onload = caricaTabella;
    </script>

</body>
</html>
