<!DOCTYPE html>
<html>
<head>          
    <meta charset="utf-8" />
    <title>Monitor Vendite</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* --- STILE GENERALE --- */
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- SEZIONI VERTICALI --- */
        .section-title {
            flex: 0 0 7%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .section-table {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-buttons {
            flex: 0 0 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* --- CONTENITORE SCROLLABILE --- */
        .scroll-box {
            flex: 1;
            width: 95%;
            margin: auto;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            background: #1b1b1b;
        }

        /* --- BOTTONI --- */
        .btn {
            width: 38%;
            height: 50px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .btn-add { background-color: #28a745; }
        .btn-del { background-color: #dc3545; }

        /* --- TABELLA --- */
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 16px;
            table-layout: fixed;
            background: #222;
        }

        th, td {
            border: 1px solid #333;
            padding: 8px;
            vertical-align: middle;
            word-wrap: break-word;
            white-space: normal;
        }

        th {
            background-color: #333;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        /* Riga selezionata */
        tr.selezionata {
            background-color: #444;
        }

        /* Nascondo colonna ID */
        td:nth-child(5),
        th:nth-child(5) {
            display: none;
        }

        /* Colonna immagini */
        td:last-child,
        th:last-child {
            width: 140px;
        }

        td:last-child img {
            width: 100%;
            max-height: 110px;
            object-fit: contain;
            display: block;
            margin: auto;
        }

        /* Altezza righe */
        td {
            height: 40px;
        }

        /* Centra prezzo e quantità */
        td:nth-child(3),
        th:nth-child(3),
        td:nth-child(4),
        th:nth-child(4) {
            text-align: center;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {

            .section-title {
                font-size: 18px;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 6px;
            }

            td:last-child img {
                max-height: 80px;
            }

            .btn {
                width: 90%;
                height: 50px;
                font-size: 17px;
            }

            .section-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* Pulsante freccia indietro */
        /* Pulsante freccia indietro */
        .back-button {
            position: fixed;
            top: 15px;
            left: 15px;
            font-size: 28px;
            font-weight: bold;
            background: #1b1b1b;
            color: #5bc0de;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            z-index: 999;
            transition: 0.2s;
        }

        .back-button:hover {
            background: #2a2a2a;
            color: #ffffff;
        }
        
    </style>
</head>

<body>

    <!-- SEZIONE TITOLO -->
    <div class="section-title">
        <div class="back-button" onclick="window.location.href = 'index.html'">←</div>
        <h1>Tabella Vendite</h1>
    </div>

    <!-- SEZIONE TABELLA -->
    <div class="section-table">
        <div class="scroll-box">
            <div id="tabella"></div>
        </div>
    </div>

    <!-- SEZIONE PULSANTI -->
    <div class="section-buttons">
        <button class="btn btn-add" onclick="vaiAggiungi()">AGGIUNGI</button>
        <button class="btn btn-del" onclick="eliminaRiga()">ELIMINA</button>
    </div>

    <script>
        const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
        );

        let rigaSelezionata = null;

        async function caricaTabella() {
            const { data: vendite } =
                await client.from("vendite").select("*").order("data", { ascending: false });

            const { data: colorazioni } =
                await client.from("colorazioni").select("*");

            if (!vendite || !colorazioni) {
                document.getElementById("tabella").innerHTML = "<p>Errore nel caricamento</p>";
                return;
            }

            const mappaColorazioni = {};
            for (const c of colorazioni) {
                if (!mappaColorazioni[c.id]) mappaColorazioni[c.id] = [];
                mappaColorazioni[c.id].push(c.percorsoimmagine);
            }

            document.getElementById("tabella").innerHTML =
                generaHTMLTabella(vendite, mappaColorazioni);
        }

        function generaHTMLTabella(dati, mappaColorazioni) {
            if (!dati.length) return "<p>Nessun dato trovato.</p>";

            const colonne = Object.keys(dati[0]).filter(c => c !== "prodottoid");
            

            let html = "<table><tr>";
            for (const col of colonne) html += `<th>${col}</th>`;
            html += `<th>Immagine</th></tr>`;

            for (const riga of dati) {
                html += `<tr onclick="selezionaRiga(this)" data-id="${riga.id}">`;


                for (const col of colonne) {
                    if (col.toLowerCase() === "immagine") {
                        html += `<td><img src="${riga[col]}"></td>`;
                    } else if (col.toLowerCase() === "data") {
                        const soloData = new Date(riga[col]).toLocaleDateString("it-IT");
                        html += `<td>${soloData}</td>`;
                    } else {
                        html += `<td>${riga[col]}</td>`;
                    }
                }

                const imgs = mappaColorazioni[riga.colorazioneid] || [];
                html += `<td>${imgs.map(src => `<img src="${src}">`).join(" ")}</td>`;

                html += "</tr>";
            }

            html += "</table>";
            return html;
        }

        function selezionaRiga(tr) {
            document.querySelectorAll("tr").forEach(r => r.classList.remove("selezionata"));
            tr.classList.add("selezionata");

            rigaSelezionata = Number(tr.dataset.id);
            console.log("ID selezionato:", rigaSelezionata);
        }


        async function eliminaRiga() {
            console.log(rigaSelezionata);
            if (!rigaSelezionata) {
                alert("Seleziona una riga prima di eliminare.");
                return;
            }
            
            
            const { error } = await client
                .from("vendite")
                .delete()
                .eq("id", rigaSelezionata);

            if (error) {
                alert("Errore durante l'eliminazione.");
                return;
            }

            alert("Riga eliminata.");
            rigaSelezionata = null;
            caricaTabella();
        }

        function vaiAggiungi() {
            window.location.href = "page_aggiungi_vendita.html";
        }

        window.onload = caricaTabella;
    </script>

</body>
</html>
