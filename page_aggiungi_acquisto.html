<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuovo acquisto · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="app-header">
    <button class="icon-btn" onclick="annulla()" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Nuovo acquisto</h1>
</header>
<main class="page page-narrow">
    <form id="formAcquisto" class="card card-pad form" onsubmit="return false">
        <div class="field">
            <label for="descrizione">Cosa hai comprato</label>
            <input type="text" id="descrizione" required>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="prezzo">Prezzo (€)</label>
                <input type="number" id="prezzo" step="0.01" inputmode="decimal" required>
            </div>
            <div class="field">
                <label for="data">Data</label>
                <input type="date" id="data" readonly>
            </div>
        </div>
        <div class="field">
            <label for="negozio">Negozio</label>
            <input type="text" id="negozio">
        </div>
        <div class="field">
            <label for="link">Link (facoltativo)</label>
            <input type="url" id="link" inputmode="url" placeholder="https://...">
        </div>
    </form>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button type="button" class="btn btn-secondary" onclick="annulla()">Annulla</button>
        <button type="button" class="btn btn-primary" onclick="aggiungiAcquisto()">Salva</button>
    </div>
</footer>
<script>
    // Autocompila la data
    document.getElementById("data").value = new Date().toISOString().split("T")[0];

    // Inizializza Supabase
    const { createClient } = supabase;
    const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );


    async function aggiungiAcquisto() {
        const nuovoAcquisto = {
            descrizione: document.getElementById("descrizione").value,
            data: document.getElementById("data").value,
            prezzo: parseFloat(document.getElementById("prezzo").value),
            negozio: document.getElementById("negozio").value,
            link: document.getElementById("link").value
        };

        // Inserimento su Supabase
        const { data, error } = await client
            .from("acquisti")
            .insert([nuovoAcquisto]);

        if (error) {
            alert("Errore nel salvataggio: " + error.message);
            return;
        }

        // Se tutto ok → torna alla pagina acquisti
        window.location.href = "page_acquisti.html";
    }

    function annulla() {
        window.location.href = "page_acquisti.html";
    }
</script>


</body>
</html>
