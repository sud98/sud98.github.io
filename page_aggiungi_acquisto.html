<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Acquisto</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- STILE GENERALE --- */
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #f5f5f5;
            padding: 20px;
            margin: 0;
        }

        /* --- CONTENITORE --- */
        .container {
            max-width: 500px;
            margin: auto;
            background: #1b1b1b;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }

        /* --- TITOLO --- */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
        }

        /* --- LABEL E INPUT --- */
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 10px;              /* più compatto */
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 17px;            /* leggermente più piccolo */
            box-sizing: border-box;     /* evita sbordi */
        }

        /* --- BOTTONI --- */
        .buttons {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        button {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        .btn-add {
            background: #5cb85c;
            color: white;
        }

        .btn-cancel {
            background: #d9534f;
            color: white;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h2 {
                font-size: 22px;
            }

            label {
                font-size: 16px;
            }

            input {
                font-size: 16px;
                padding: 9px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
                font-size: 17px;
                padding: 14px;
            }
        }

    </style>
</head>

<body>

<div class="container">
    <h2>Aggiungi Acquisto</h2>

    <form id="formAcquisto">

        <label>Descrizione</label>
        <input type="text" id="descrizione" required>

        <label>Data</label>
        <input type="date" id="data" readonly>

        <label>Prezzo</label>
        <input type="number" id="prezzo" step="0.01" required>

        <label>Negozio</label>
        <input type="text" id="negozio">

        <label>Link</label>
        <input type="url" id="link">

        <div class="buttons">
            <button type="button" class="btn-add" onclick="aggiungiAcquisto()">Aggiungi</button>
            <button type="button" class="btn-cancel" onclick="annulla()">Annulla</button>
        </div>

    </form>
</div>

<script>
    // Autocompila la data
    document.getElementById("data").value = new Date().toISOString().split("T")[0];

    // Inizializza Supabase
    const { createClient } = supabase;
    const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );


    async function aggiungiAcquisto() {
        const nuovoAcquisto = {
            descrizione: document.getElementById("descrizione").value,
            data: document.getElementById("data").value,
            prezzo: parseFloat(document.getElementById("prezzo").value),
            negozio: document.getElementById("negozio").value,
            link: document.getElementById("link").value
        };

        // Inserimento su Supabase
        const { data, error } = await client
            .from("acquisti")
            .insert([nuovoAcquisto]);

        if (error) {
            alert("Errore nel salvataggio: " + error.message);
            return;
        }

        // Se tutto ok → torna alla pagina acquisti
        window.location.href = "page_acquisti.html";
    }

    function annulla() {
        window.location.href = "page_acquisti.html";
    }
</script>


</body>
</html>
