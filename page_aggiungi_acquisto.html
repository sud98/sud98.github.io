<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Acquisto</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .buttons {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
        }
        .btn-add {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-cancel {
            background: #d9534f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Aggiungi Acquisto</h2>

    <form id="formAcquisto">

        <label>Descrizione</label>
        <input type="text" id="descrizione" required>

        <label>Data</label>
        <input type="date" id="data" readonly>

        <label>Prezzo</label>
        <input type="number" id="prezzo" step="0.01" required>

        <label>Negozio</label>
        <input type="text" id="negozio">

        <label>Link</label>
        <input type="url" id="link">

        <div class="buttons">
            <button type="button" class="btn-add" onclick="aggiungiAcquisto()">Aggiungi</button>
            <button type="button" class="btn-cancel" onclick="annulla()">Annulla</button>
        </div>

    </form>
</div>

<script>
    // Autocompila la data
    document.getElementById("data").value = new Date().toISOString().split("T")[0];

    // Inizializza Supabase
    const { createClient } = supabase;
    const client = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );


    async function aggiungiAcquisto() {
        const nuovoAcquisto = {
            descrizione: document.getElementById("descrizione").value,
            data: document.getElementById("data").value,
            prezzo: parseFloat(document.getElementById("prezzo").value),
            negozio: document.getElementById("negozio").value,
            link: document.getElementById("link").value
        };

        // Inserimento su Supabase
        const { data, error } = await supabase
            .from("acquisti")
            .insert([nuovoAcquisto]);

        if (error) {
            alert("Errore nel salvataggio: " + error.message);
            return;
        }

        // Se tutto ok → torna alla pagina acquisti
        window.location.href = "page_acquisti.html";
    }

    function annulla() {
        window.location.href = "page_acquisti.html";
    }
</script>


</body>
</html>
