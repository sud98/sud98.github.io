<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuova vendita · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="app-header">
    <a class="icon-btn" href="page_vendite.html" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Nuova vendita</h1>
    <button class="header-link" onclick="window.location.href='page_aggiungi_vendita_2.html'">Inserisci a mano</button>
</header>
<main class="page">
    <div class="filters">
        <select id="filtro_prodotto" onchange="filterProdotti()"><option value="">Prodotto</option></select>
        <select id="filtro_tipologia" onchange="filterProdotti()"><option value="">Tipologia</option></select>
        <select id="filtro_tema" onchange="filterProdotti()"><option value="">Tema</option></select>
        <input type="text" id="filtro_descrizione" placeholder="Cerca..." oninput="filterProdotti()">
    </div>
    <p class="hint">Scegli il colore toccando la foto, poi premi + per aggiungerlo al carrello.</p>
    <div class="table-wrap picker" id="tabellaProdotti"><p>Caricamento…</p></div>

    <div class="cart-head"><p class="section-label">Carrello</p></div>
    <div class="cart" id="carrelloContainer">
        <p>Carrello vuoto</p>
    </div>

    <div class="field-row">
        <div class="field">
            <label for="Destinatario">Destinatario</label>
            <input type="text" id="Destinatario" placeholder="Nome" autocomplete="off">
        </div>
        <div class="field">
            <label for="dataVendita">Data</label>
            <input type="date" id="dataVendita">
        </div>
    </div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-secondary" onclick="window.location.href='page_vendite.html'">Annulla</button>
        <button class="btn btn-primary" onclick="confermaVendita()">Conferma vendita</button>
    </div>
</footer>
    <script>
        const client = supabase.createClient("https://ixarnqyrsonhshkctcki.supabase.co", "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ");
        let tutteLeColorazioni = [], prodottiCache = [], carrello = [];

        window.onload = async () => {
            await Promise.all([loadFiltri(), caricaProdotti()]);
            document.getElementById("dataVendita").value = new Date().toISOString().split("T")[0];
        };

        async function loadFiltri() {
            const fetchFilter = (table) => client.from(table).select("codice");
            const [p, ti, te] = await Promise.all([fetchFilter("sigla_prodotto"), fetchFilter("sigla_tipologia"), fetchFilter("sigla_tema")]);
            
            const fill = (el, data) => data?.forEach(i => el.innerHTML += `<option value="${i.codice}">${i.codice}</option>`);
            fill(document.getElementById("filtro_prodotto"), p.data);
            fill(document.getElementById("filtro_tipologia"), ti.data);
            fill(document.getElementById("filtro_tema"), te.data);
        }

        async function caricaProdotti() {
            const { data: p } = await client.from("prodotti").select("*");
            const { data: c } = await client.from("colorazioni").select("*");
            prodottiCache = p;
            tutteLeColorazioni = c;
            renderProdotti();
        }

        function filterProdotti() { renderProdotti(); }

        function renderProdotti() {
            const fP = document.getElementById("filtro_prodotto").value;
            const fTi = document.getElementById("filtro_tipologia").value;
            const fTe = document.getElementById("filtro_tema").value;
            const fD = document.getElementById("filtro_descrizione").value.toLowerCase();

            const filtrati = prodottiCache.filter(p => 
                (!fP || p.prodotto === fP) && (!fTi || p.tipologia === fTi) && 
                (!fTe || p.tema === fTe) && (!fD || p.descrizione?.toLowerCase().includes(fD))
            );

            let html = `<table><thead><tr><th>Info</th><th>Colore</th><th>+</th></tr></thead><tbody>`;
            filtrati.forEach(p => {
                const colori = tutteLeColorazioni.filter(c => c.prodottoid === p.id);
                html += `
                <tr data-id="${p.id}">
                    <td style="font-size:12px"><b>${p.prodotto}</b><br>${p.descrizione || ''}</td>
                    <td>
                        <div class="color-select-display" onclick="toggleColorMenu('${p.id}')">
                            <img id="preview-${p.id}" src="${colori[0]?.percorsoimmagine}" data-idcol="${colori[0]?.id}">
                        </div>
                        <div class="color-select-options" id="options-${p.id}">
                            ${colori.map(c => `<img src="${c.percorsoimmagine}" onclick="selezionaColorazione('${p.id}','${c.percorsoimmagine}','${c.id}')">`).join('')}
                        </div>
                    </td>
                    <td><button class="btn-add" onclick="aggiungiAlCarrello('${p.id}')">+</button></td>
                </tr>`;
            });
            document.getElementById("tabellaProdotti").innerHTML = html + `</tbody></table>`;
        }

        function toggleColorMenu(id) {
            const menu = document.getElementById(`options-${id}`);
            const riga = document.querySelector(`tr[data-id="${id}"]`);
            const isOpen = menu.style.display === "flex";

            document.querySelectorAll(".color-select-options").forEach(m => m.style.display = "none");
            document.querySelectorAll("tr").forEach(r => r.classList.remove("row-open"));

            if (!isOpen) {
                menu.style.display = "flex";
                riga.classList.add("row-open");
            }
        }

        function selezionaColorazione(id, path, idCol) {
            const img = document.getElementById(`preview-${id}`);
            img.src = path;
            img.dataset.idcol = idCol;
            toggleColorMenu(id); // Chiude
        }

        function aggiungiAlCarrello(id) {
            const p = prodottiCache.find(x => x.id == id);
            const colImg = document.getElementById(`preview-${id}`);
            const idCol = colImg.dataset.idcol;

            if (!idCol) return alert("Seleziona colore");

            const exist = carrello.find(c => c.idCol === idCol);
            if (exist) exist.qta++;
            else carrello.push({ id, idCol, img: colImg.src, nome: p.prodotto, prezzo: p.prezzo || 0, qta: 1 });
            
            aggiornaCarrello();
        }

        function aggiornaCarrello() {
            const cont = document.getElementById("carrelloContainer");
            if (!carrello.length) return cont.innerHTML = "<p>Carrello vuoto</p>";

            let h = `<table><tr><th>Img</th><th>Prezzo</th><th>Q.ta</th><th>X</th></tr>`;
            carrello.forEach((c, i) => {
                h += `<tr>
                    <td><img src="${c.img}" style="width:50px"></td>
                    <td><input type="number" value="${c.prezzo}" step="0.1" onchange="carrello[${i}].prezzo=this.value" style="width:50px"></td>
                    <td><input type="number" value="${c.qta}" onchange="carrello[${i}].qta=this.value" style="width:40px"></td>
                    <td><button onclick="carrello.splice(${i},1);aggiornaCarrello()">X</button></td>
                </tr>`;
            });
            cont.innerHTML = h + `</table>`;
        }

        async function confermaVendita() {
            const dest = document.getElementById("Destinatario").value;
            const dataV = document.getElementById("dataVendita").value;
            if (!carrello.length || !dest) return alert("Dati mancanti");

            const rows = [];
            carrello.forEach(c => {
                for(let i=0; i<c.qta; i++) rows.push({ colorazioneid: c.idCol, prezzo: c.prezzo, destinatario: dest, data: dataV });
            });

            const { error } = await client.from("vendite").insert(rows);
            if (error) return alert("Errore");
            for (const r of rows) await muoviMagazzino(client, r.colorazioneid, -1);
            window.location.href = "page_vendite.html";
        }

        // Chiudi se clicchi fuori
        document.addEventListener("click", e => {
            if (!e.target.closest('.color-select-display') && !e.target.closest('.color-select-options')) {
                document.querySelectorAll(".color-select-options").forEach(m => m.style.display = "none");
                document.querySelectorAll("tr").forEach(r => r.classList.remove("row-open"));
            }
        });
    </script>
</body>
</html>
