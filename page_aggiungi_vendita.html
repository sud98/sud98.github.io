<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Aggiungi Vendita</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- STILE GENERALE --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111;
            color: #f5f5f5;
        }

        /* --- TITOLI SEZIONI --- */
        .section-title,
        .section-carrello-title {
            flex: 0 0 5%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        /* --- FILTRI --- */
        .filters {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .filters select,
        .filters input {
            height: 45px;          /* aumenta l’altezza */
            font-size: 16px;       /* testo più grande */
            padding: 8px 12px;     /* più spazio interno */
            border-radius: 6px;    /* opzionale: angoli arrotondati */
        }
        .filters text {
            height: 45px;          /* aumenta l’altezza */
            font-size: 16px;       /* testo più grande */
            padding: 8px 12px;     /* più spazio interno */
            border-radius: 6px;    /* opzionale: angoli arrotondati */
        }

        /* --- SEZIONI PRINCIPALI --- */
        .section-prodotti {
            flex: 0 0 45%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .section-carrello {
            flex: 0 0 25%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .section-dati {
            flex: 0 0 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 10px 20px;
            font-size: 18px;
        }

        .section-bottoni {
            flex: 0 0 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* --- CONTENITORI SCROLLABILI --- */
        .scroll-box {
            flex: 1;
            width: 95%;
            margin: auto;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            background: #222;
        }

        /* --- TABELLE --- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
            table-layout: fixed; /* evita scroll orizzontale */
        }

        table td, table th {
            border: 1px solid #333;
            padding: 6px 8px;
            vertical-align: middle;
            word-wrap: break-word;
            white-space: normal;
        }

        /* Header sticky */
        thead th {
            position: sticky;
            top: 0;
            background: #333;
            z-index: 5;
        }

        /* --- IMMAGINI --- */
        table td img {
            width: 100%;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            display: block;
            margin: auto;
        }

        /* --- COLONNE STRETTE --- */
        #tabellaprodotti td:nth-child(1),
        #tabellaprodotti th:nth-child(1),
        #tabellaprodotti td:nth-child(2),
        #tabellaprodotti th:nth-child(2),
        #tabellaprodotti td:nth-child(3),
        #tabellaprodotti th:nth-child(3),
        #tabellaprodotti td:nth-child(4),
        #tabellaprodotti th:nth-child(4),
        #tabellaprodotti td:nth-child(6),
        #tabellaprodotti th:nth-child(6) {
            width: 80px;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* ultima colonna: contenitore del bottone */
        #tabellaprodotti td:last-child {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;          /* stessa altezza massima delle immagini */
        }

        /* --- CARRELLO --- */
        #tabellaCarrello td:nth-child(1),
        #tabellaCarrello th:nth-child(1),
        #tabellaCarrello td:nth-child(2),
        #tabellaCarrello th:nth-child(2) {
            width: 35%;
        }

        #tabellaCarrello td:nth-child(3),
        #tabellaCarrello th:nth-child(3),
        #tabellaCarrello td:nth-child(4),
        #tabellaCarrello th:nth-child(4),
        #tabellaCarrello td:nth-child(5),
        #tabellaCarrello th:nth-child(5) {
            width: 10%;
        }

        /* --- SELECTOR COLORAZIONI --- */
        .color-select {
            width: 100%;
            height: 100%;
            cursor: pointer;
            user-select: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-select-display {
            width: 100%;
            height: 100%;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1b1b1b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-select-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        /* Menu colorazioni */
        .color-select-options {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-height: 250px;
            overflow-y: auto;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 5px;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .color-select-options img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            margin-bottom: 5px;
        }

        .color-select-options img:hover {
            border-color: #5cb85c;
        }

        /* --- INPUT DATI --- */
        .section-dati label {
            font-weight: bold;
            width: 20%;
        }

        .section-dati input {
            width: 40%;
            padding: 8px 12px;
            font-size: 18px;
            border: 2px solid #444;
            border-radius: 6px;
            background: #1b1b1b;
            color: #fff;
        }

        /* --- BOTTONI --- */
        .section-bottoni button {
            width: 45%;
            height: 60px;
            font-size: 22px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* bottone + grande che riempie quasi tutta la cella */
        .btn-add {
            background: #5cb85c;
            color: white;
            width: 90%;
            height: 90%;
            font-size: 40px;        /* ingrandisce il + */
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }


        .btn-del {
            background: #d9534f;
            color: white;
        }

        /* --- TOPBAR: pulsante full-width con freccia a destra --- */
        .topbar {
            width: 100%;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
            padding: 16px 0;
        }

        /* Pulsante che occupa tutta la larghezza della topbar */
        .topbar .topbar-button {
            display: block;
            width: 80%;
            height: 100px;
            border-radius: 6px;
            border: none;
            font-size: 38px;
            text-align: center;          /* freccia allineata a destra */
            cursor: pointer;
            box-sizing: border-box;
            margin: 0 auto;
        }

        /* effetto hover leggero */
        .topbar .topbar-button:hover {
            background: #232323;
        }

        /* Titolo sotto la topbar, centrato */
        .titolo-pagina {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin: 12px 0 10px 0;
            color: white;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {

            .section-title,
            .section-carrello-title {
                font-size: 18px;
            }

            .filters {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            


            table {
                font-size: 14px;
            }

            table td, table th {
                padding: 4px;
                font-size: 14px;
            }

            table td img {
                max-height: 80px;
            }

            .section-dati {
                flex-direction: column;
                gap: 10px;
                font-size: 16px;
            }

            .section-dati label,
            .section-dati input {
                width: 100%;
            }

            .section-bottoni {
                flex-direction: column;
                gap: 10px;
            }

            .section-bottoni button {
                width: 90%;
                height: 55px;
                font-size: 18px;
            }

            .scroll-box {
                border-width: 1px;
                padding: 6px;
            }

            .topbar .topbar-button {
                height: 60px;
                width: 90%;
                font-size: 32px;
                padding-right: 16px;
            }
            .titolo-pagina {
                font-size: 22px;
                margin-top: 10px;
            }

        }
    </style>
</head>


<body>
    <!-- BARRA SUPERIORE: pulsante full-width con freccia a destra -->
    <div class="topbar">
        <button class="topbar-button" onclick="window.location.href='page_aggiungi_vendita_2.html'">
            &#8594;
        </button>
    </div>

    <!-- TITOLO SOTTO LA TOPBAR -->
    <div class="titolo-pagina">Aggiungi Vendita</div>

    <!-- FILTRI -->
    <div class="filters">
        <select id="filtro_prodotto" onchange="filterProdotti()">
            <option value="">Tutti i prodotti</option>
        </select>

        <select id="filtro_tipologia" onchange="filterProdotti()">
            <option value="">Tutte le tipologie</option>
        </select>

        <select id="filtro_tema" onchange="filterProdotti()">
            <option value="">Tutti i temi</option>
        </select>

        <input type="text" id="filtro_descrizione" placeholder="Filtra per descrizione..." oninput="filterProdotti()">
    </div>

    <div class="section-prodotti">
        <div class="scroll-box">
            <div id="tabellaProdotti"></div>
        </div>
    </div>

    <div class="section-carrello-title">
        <h2>Carrello</h2>
    </div>

    <div class="section-carrello">
        <div class="scroll-box" id="carrelloContainer">
            <p>Carrello vuoto</p>
        </div>
    </div>

    <div class="section-dati">
        <label for="campo1">Destinatario:</label>
        <input type="text" id="Destinatario" placeholder="Inserisci nome">

        <label for="dataVendita">Data vendita:</label> 
        <input type="date" id="dataVendita">
    </div>


    <div class="section-bottoni">
        <button onclick="confermaVendita()">Conferma</button>
        <button onclick="window.location.href='page_vendite.html'">Annulla</button>
    </div>

    <script>
        const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
        );
        let tutteLeColorazioni = [];
        let strutturaProdotto = null;
        let carrello = [];
        let prodottiCache2 = [];

        window.onload = async ()=>{
            await loadFiltri();
            await caricaProdotti();
            const oggi = new Date().toISOString().split("T")[0];
            document.getElementById("dataVendita").value = oggi;
        };

        /* ============================
        CARICAMENTO FILTRI
        ============================ */
        async function loadFiltri() {
            const [prodotti, tipologie, temi] = await Promise.all([
                client.from("sigla_prodotto").select("*").order("codice", { ascending: true }),
                client.from("sigla_tipologia").select("*").order("codice", { ascending: true }),
                client.from("sigla_tema").select("*").order("codice", { ascending: true })
            ]);

            const selProd = document.getElementById("filtro_prodotto");
            const selTip  = document.getElementById("filtro_tipologia");
            const selTema = document.getElementById("filtro_tema");

            if (!prodotti.error) {
                prodotti.data.forEach(p => {
                    const opt = document.createElement("option");
                    opt.value = p.codice;
                    opt.textContent = p.codice;
                    selProd.appendChild(opt);
                });
            }

            if (!tipologie.error) {
                tipologie.data.forEach(t => {
                    const opt = document.createElement("option");
                    opt.value = t.codice;
                    opt.textContent = t.codice;
                    selTip.appendChild(opt);
                });
            }

            if (!temi.error) {
                temi.data.forEach(t => {
                    const opt = document.createElement("option");
                    opt.value = t.codice;
                    opt.textContent = t.codice;
                    selTema.appendChild(opt);
                });
            }
        }

       async function caricaProdotti() {
            const { data: prodotti } =
                await client.from("prodotti").select("*").order("id", { ascending: true });

            const { data: colorazioni } =
                await client.from("colorazioni").select("id, prodottoid, percorsoimmagine");

            tutteLeColorazioni = colorazioni;
            strutturaProdotto = prodotti[0];

            prodottiCache2 = prodotti;   // <-- CACHE

            renderProdotti();           // <-- NUOVA FUNZIONE DI RENDER
        }

        function generaTabellaProdotti(dati) {
            const colonneDaSaltare = ["id","prodotto", "tipologia", "tema","sigla_prodotto", "sigla_tipologia", "sigla_tema"];
            const colonne = Object.keys(dati[0]).filter(c => !colonneDaSaltare.includes(c));
            let html = '<table><tr>';
            for (const col of colonne) html += `<th>${col}</th>`;
            html += `<th>Colorazione</th><th>Aggiungi</th></tr>`;
                for (const riga of dati) {
                    html += `<tr data-id="${riga.id}">`;
                    for (const col of colonne) html += `<td>${riga[col]}</td>`;
                    const colori = tutteLeColorazioni.filter(c => c.prodottoid === riga.id);
                    let select = `
                        <div class="color-select" data-id="${riga.id}">
                            <div class="color-select-display">
                                <img id="color-preview-${riga.id}" 
                                    src="${colori[0]?.percorsoimmagine}" 
                                    data-idcolorazione="${colori[0]?.id}"
                                    onclick="toggleColorMenu('${riga.id}')">
                            </div>
                            <div class="color-select-options" id="color-options-${riga.id}">
                    `;
                    colori.forEach(c => {
                        select += `
                            <img 
                                src="${c.percorsoimmagine}" 
                                data-idcolorazione="${c.id}" 
                                onclick="selezionaColorazione('${riga.id}', '${c.percorsoimmagine}', '${c.id}')"
                            >
                        `;
                        console.log("GeneraTabella: ", c.id);
                    });
                    select += `
                            </div>
                        </div>
                    `;
                    html += `<td>${select}</td>`;
                    /*html += `<td><button onclick="aggiungiAlCarrello(${riga.id})">+</button></td>`;*/
                    html += `<td><button class="btn-add" onclick="aggiungiAlCarrello('${riga.id}')">+</button></td>`;
                    html += "</tr>";
                }
            html += "</table>";
            return html;
        }

        function filterProdotti() {
            renderProdotti();
        }

        function renderProdotti() {
            const fProd = document.getElementById("filtro_prodotto").value;
            const fTip  = document.getElementById("filtro_tipologia").value;
            const fTema = document.getElementById("filtro_tema").value;
            const fDesc = document.getElementById("filtro_descrizione").value.toLowerCase();

            const filtrati = prodottiCache2
                .filter(p => !fProd || p.prodotto === fProd)
                .filter(p => !fTip  || p.tipologia === fTip)
                .filter(p => !fTema || p.tema === fTema)
                .filter(p => !fDesc || (p.descrizione || "").toLowerCase().includes(fDesc));

            document.getElementById("tabellaProdotti").innerHTML =
                generaTabellaProdotti(filtrati);
        }

        function toggleColorMenu(idProdotto) {
            const menu = document.getElementById(`color-options-${idProdotto}`);
            const riga = document.querySelector(`tr[data-id="${idProdotto}"]`);
            const isOpen = menu.style.display === "flex";

            // chiudi tutti i menu e resetta le righe
            document.querySelectorAll(".color-select-options").forEach(m => {
                m.style.display = "none";
                m.style.pointerEvents = "none";
            });
            document.querySelectorAll("tr").forEach(r => r.classList.remove("row-open"));

            if (!isOpen) {
                menu.style.display = "flex";
                menu.style.pointerEvents = "auto";
                riga.classList.add("row-open");   // questa riga sale sopra le altre
            }
        }

        function selezionaColorazione(idProdotto, imgPath, idColorazione) {
            console.log("Hai premuto il pulsante con:", idProdotto);
            console.log("Hai premuto il pulsante con:", imgPath);
            console.log("Hai premuto il pulsante con:", idColorazione);
            const preview = document.getElementById(`color-preview-${idProdotto}`);
            // aggiorna immagine
            preview.src = imgPath;
            // 🔥 salva l'id della colorazione selezionata
            preview.dataset.idcolorazione = idColorazione;
            // 🔥 salva anche sulla riga (più robusto)
            const riga = document.querySelector(`tr[data-id="${idProdotto}"]`);
            riga.dataset.colorazioneSelezionata = idColorazione;
            // chiudi menu
            const menu = document.getElementById(`color-options-${idProdotto}`);
            menu.style.display = "none";
            menu.style.pointerEvents = "none";
        }

        function aggiungiAlCarrello(idProdotto) {
            let html = `
                <table style="width:100%">
                    <tr>
                        <th>ID</th>
                        <th>Immagine</th>
                        <th>Prezzo</th>
                        <th>Q.tà</th>
                        <th></th>
                    </tr>
            `;
            const riga = document.querySelector(`tr[data-id="${idProdotto}"]`);
            const celle = riga.querySelectorAll("td");
            const nome = celle[1].innerText;
            const prezzo = parseFloat(celle[3].innerText);
            const preview = document.getElementById(`color-preview-${idProdotto}`);
            const colorazione = preview.src;
            const idColorazione = preview.dataset.idcolorazione;
            if (!idColorazione) {
                alert("Seleziona una colorazione prima di aggiungere al carrello.");
                return;
            }
            const esistente = carrello.find(x => x.id === idProdotto && x.idColorazione === idColorazione);
            if (esistente) {
                esistente.quantita++;
            } else {
                carrello.push({
                    id: idProdotto,
                    idColorazione: idColorazione,
                    nome,
                    colorazione,
                    prezzo,
                    quantita: 1
                });
            }
            aggiornaCarrello();
        }

        function aggiornaCarrello() {
            if (carrello.length === 0) {
                document.getElementById("carrelloContainer").innerHTML = "<p>Carrello vuoto</p>";
                return;
            }

            let html = "<table><tr><th>Colorazione ID</th><th>Immagine</th><th>Prezzo</th><th>Q.tà</th><th></th></tr>";

            carrello.forEach((item, index) => {
                html += `
                    <tr>
                        <td>${item.idColorazione}</td>
                        <td><img src="${item.colorazione}" style="width:100px;height:70px;object-fit:contain;border-radius:6px;"></td>
                         <td>
                    <input type="number"
                            class="prezzo-input"
                            value="${item.prezzo}"
                            min="0"
                            step="0.01"
                            data-index="${index}">
                    </td>
                        <td>
                            <input type="number" min="1" value="${item.quantita}" 
                                onchange="cambiaQuantita(${index}, this.value)">
                        </td>
                        <td><button onclick="rimuoviDalCarrello(${index})">X</button></td>
                    </tr>
                `;
            });

            html += "</table>";

            document.getElementById("carrelloContainer").innerHTML = html;
        }

        function cambiaQuantita(index, nuovaQta) {
            carrello[index].quantita = parseInt(nuovaQta);
            aggiornaCarrello();
        }

        function rimuoviDalCarrello(index) {
            carrello.splice(index, 1);
            aggiornaCarrello();
        }

        async function confermaVendita() {
            if (carrello.length === 0) {
                alert("Il carrello è vuoto.");
                return;
            }

            const nomeCliente = document.getElementById("Destinatario").value.trim();
            const dataVendita = document.getElementById("dataVendita").value;

            if (!nomeCliente) {
                alert("Inserisci il nome del cliente.");
                return;
            }

            let righeDaInserire = [];

            // Per ogni elemento del carrello...
            carrello.forEach(item => {
                // ...creo N righe, dove N = quantità
                for (let i = 0; i < item.quantita; i++) {
                    righeDaInserire.push({
                        colorazioneid: item.idColorazione,
                        prezzo: item.prezzo,
                        destinatario: nomeCliente,
                        data: dataVendita
                    });
                }
            });

            console.log(righeDaInserire);

            // Inserimento multiplo in Supabase
            const { data, error } = await client
                .from("vendite")
                .insert(righeDaInserire);

            if (error) {
                console.error("Errore durante il salvataggio:", error);
                alert("Errore durante il salvataggio.");
                return;
            }

            // Tutto ok → torna alla pagina vendite
            window.location.href = "page_vendite.html";
        }

        document.addEventListener("click", function (e) {
            const tuttiMenu = document.querySelectorAll(".color-select-options");

            tuttiMenu.forEach(menu => {
                if (!menu.contains(e.target) && !menu.previousElementSibling.contains(e.target)) {
                    menu.style.display = "none";
                    menu.style.pointerEvents = "none";
                }
            });
        });

        
    </script>

</body>
</html>
