<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuovo colore · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="app-header">
    <button class="icon-btn" onclick="page_colorazioni()" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Nuovo colore</h1>
</header>
<main class="page page-narrow">
    <div class="card card-pad form">
        <div class="field">
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" placeholder="Es. Noce scuro" required>
        </div>
        <div class="field">
            <label for="immagine">Foto</label>
            <input type="file" id="immagine" accept="image/*" required>
        </div>
    </div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-secondary" onclick="page_colorazioni()">Annulla</button>
        <button class="btn btn-primary" onclick="salvaColorazione()">Salva</button>
    </div>
</footer>
<script>
const { createClient } = supabase;

const db = createClient(
    "https://ixarnqyrsonhshkctcki.supabase.co",
    "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
);

const urlParams = new URLSearchParams(window.location.search);
const prodottoID = urlParams.get("id");

function page_colorazioni() {
    window.location.href = "page_colorazioni.html?id=" + prodottoID;;
}

async function salvaColorazione() {
    const descrizione = document.getElementById("descrizione").value.trim();
    const file = document.getElementById("immagine").files[0];

    if (!descrizione || !file) {
        alert("Compila tutti i campi");
        return;
    }

    // 2️⃣ Calcolo il prossimo ID
    const { data: existing } = await db
        .from("colorazioni")
        .select("id")
        .eq("prodottoid", prodottoID);

    const nextNumber = existing.length + 1;
    const id = `${prodottoID}_${String(nextNumber).padStart(2, "0")}`;

    // 3️⃣ Carico l'immagine su Supabase Storage
    const filePath = `${id}.png`;

    const { error: uploadError } = await db.storage
        .from("Immagini")
        .upload(filePath, file, { upsert: true });

    if (uploadError) {
        console.error(uploadError);
        alert("Errore caricando immagine");
        return;
    }

    // 4️⃣ Ottengo l’URL pubblico
    const { data: urlData } = db.storage
        .from("Immagini")
        .getPublicUrl(filePath);

    const publicURL = urlData.publicUrl;

    // 5️⃣ Inserisco il record nella tabella
    const { error: insertError } = await db
        .from("colorazioni")
        .insert({
            id,
            prodottoid: prodottoID,
            descrizione,
            percorsoimmagine: publicURL
        });

    if (insertError) {
        console.error(insertError);
        alert("Errore salvando colorazione");
        return;
    }

    alert("Colorazione aggiunta!");
    window.history.back();
}

</script>

</body>
</html>
