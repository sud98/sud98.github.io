<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Dettaglio Ordine</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- STILE GENERALE --- */
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #f5f5f5;
            padding: 20px;
            margin: 0;
        }

        /* --- CONTENITORE CENTRALE --- */
        .container {
            max-width: 500px;
            margin: auto;
            background: #1b1b1b;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }

        /* --- TITOLO --- */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
        }

        /* --- FRECCIA INDIETRO --- */
        .arrow {
            background: none;
            border: none;
            color: #5bc0de;
            font-size: 28px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        /* --- LABEL E INPUT --- */
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 18px;
        }

        /* --- BOTTONI --- */
        .buttons {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-add {
            background: #5cb85c;
            color: white;
        }

        .btn-cancel {
            background: #d9534f;
            color: white;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h2 {
                font-size: 22px;
            }

            label {
                font-size: 16px;
            }

            input {
                font-size: 16px;
                padding: 10px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
                font-size: 18px;
                padding: 14px;
            }

            .arrow {
                font-size: 26px;
            }
        }

    </style>
</head>

<body>

<div class="container">
    <button class="arrow left" onclick="indietro()">&#8592;</button>
    <h2>Aggiungi Vendita</h2>

    <form id="formAcquisto">

        <label>Descrizione</label>
        <input type="text" id="descrizione" required>

        <label>Prezzo</label>
        <input type="number" id="prezzo" step="0.01" required>

        <div class="buttons">
            <button type="button" class="btn-add" onclick="aggiungiDettaglioOrdine()">Aggiungi</button>
            <button type="button" class="btn-cancel" onclick="annulla()">Annulla</button>
        </div>

    </form>
</div>

<script>
    // Inizializza Supabase
    const { createClient } = supabase;
    const client = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const ordineID = urlParams.get("id");

    async function aggiungiDettaglioOrdine() {
        const nuovaVendita = {
            ordineid : ordineID,
            colorazioneid: document.getElementById("descrizione").value,
            prezzo: document.getElementById("prezzo").value,
            preparato: false,
            consegnato: false
        };

        // Inserimento su Supabase
        const { data, error } = await client
            .from("ordine_dettaglio")
            .insert([nuovaVendita]);

        if (error) {
            alert("Errore nel salvataggio: " + error.message);
            return;
        }

        // Se tutto ok → torna alla pagina acquisti
        window.location.href = "page_ordine_dettaglio.html?id=" + ordineID;
    }

    function indietro() {
        window.location.href = "page_aggiungi_dettaglio_ordine.html?id=" + ordineID;
    }

    function annulla() {
        window.location.href = "page_ordine_dettaglio.html?id=" + ordineID;
    }
</script>


</body>
</html>
