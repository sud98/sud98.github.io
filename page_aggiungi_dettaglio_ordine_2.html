<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Prodotto manuale · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="app-header">
    <button class="icon-btn" onclick="indietro()" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Prodotto manuale</h1>
</header>
<main class="page page-narrow">
    <form id="formAcquisto" class="card card-pad form" onsubmit="return false">
        <p class="hint">Per articoli su misura o non presenti nel catalogo.</p>
        <div class="field">
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" required>
        </div>
        <div class="field">
            <label for="prezzo">Prezzo (€)</label>
            <input type="number" id="prezzo" step="0.01" inputmode="decimal" required>
        </div>
        <div class="field">
            <label for="nota">Nota</label>
            <textarea id="nota" rows="6" required></textarea>
        </div>
    </form>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button type="button" class="btn btn-secondary" onclick="annulla()">Annulla</button>
        <button type="button" class="btn btn-primary" onclick="aggiungiDettaglioOrdine()">Aggiungi</button>
    </div>
</footer>
<script>
    // Inizializza Supabase
    const { createClient } = supabase;
    const client = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const ordineID = urlParams.get("id");

    async function aggiungiDettaglioOrdine() {
        const nuovaVendita = {
            ordineid : ordineID,
            colorazioneid: document.getElementById("descrizione").value,
            prezzo: document.getElementById("prezzo").value,
            nota: document.getElementById("nota").value,
            preparato: false,
            consegnato: false
        };

        // Inserimento su Supabase
        const { data, error } = await client
            .from("ordine_dettaglio")
            .insert([nuovaVendita]);

        if (error) {
            alert("Errore nel salvataggio: " + error.message);
            return;
        }

        // Se tutto ok → torna alla pagina acquisti
        window.location.href = "page_ordine_dettaglio.html?id=" + ordineID;
    }

    function indietro() {
        window.location.href = "page_aggiungi_dettaglio_ordine.html?id=" + ordineID;
    }

    function annulla() {
        window.location.href = "page_ordine_dettaglio.html?id=" + ordineID;
    }
</script>


</body>
</html>
