<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Colorazioni · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <a class="icon-btn" href="page_prodotti.html" aria-label="Torna ai prodotti"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Colorazioni</h1>
</header>
<main class="page">
    <p class="hint">Tocca la descrizione per modificarla. Tocca due volte l'immagine per sostituirla.</p>
    <div class="table-wrap">
        <table id="table_colori">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrizione</th>
                    <th>Immagine</th>
                </tr>
            </thead>
            <tbody><tr><td colspan="3" class="loading">Caricamento…</td></tr></tbody>
        </table>
    </div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaColorazione()">Elimina</button>
        <button class="btn btn-primary" onclick="aggiungiColorazione()">+ Aggiungi colore</button>
    </div>
</footer>
<script>
    const { createClient } = supabase;

    const db = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    const BASE_IMG_URL = "https://ixarnqyrsonhshkctcki.supabase.co/storage/v1/object/public/Immagini/";

    const urlParams = new URLSearchParams(window.location.search);
    const prodottoID = urlParams.get("id");

    let colorazioniCache = [];
    let selezionata = null;

    window.onload = () => {
        loadColorazioni();
    };

    async function loadColorazioni() {
        const { data, error } = await db
            .from("colorazioni")
            .select("*")
            .eq("prodottoid", prodottoID)
            .order("id", { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        colorazioniCache = data;
        renderColorazioni();
    }

    function renderColorazioni() {
        const tbody = document.querySelector("#table_colori tbody");
        tbody.innerHTML = "";

        colorazioniCache.forEach(row => {
            const tr = document.createElement("tr");

            tr.onclick = () => {
                selezionata = row;
                evidenziaRiga(tr);
            };

            //const imgUrl = BASE_IMG_URL + row.id + ".png";
            const imgUrl = BASE_IMG_URL + row.id + ".png?cache=" + Date.now();

            tr.innerHTML = `
                <td>${row.id}</td>
                <td contenteditable="true" onblur="updateDescrizione('${row.id}', this.innerText)">
                    ${row.descrizione || ""}
                </td>
                <td><img src="${imgUrl}" ondblclick="cambiaImmagine('${row.id}')"></td>
            `;

            tbody.appendChild(tr);
        });
    }

    function evidenziaRiga(trSel) {
        document.querySelectorAll("#table_colori tbody tr").forEach(tr => {
            tr.classList.remove("selezionata");
        });
        trSel.classList.add("selezionata");
    }

    async function updateDescrizione(id, value) {
        const descrizione = value.trim();

        const { error } = await db
            .from("colorazioni")
            .update({ descrizione })
            .eq("id", id);

        if (error) {
            alert("Errore aggiornando descrizione");
            loadColorazioni();
        }
    }

    function indietro() {
        window.history.back();
    }

    function aggiungiColorazione() {
        window.location.href = "page_aggiungi_colorazione.html?id=" + prodottoID;
    }

    async function eliminaColorazione() {
        if (!selezionata) {
            alert("Seleziona una colorazione");
            return;
        }

        if (!confirm("Vuoi eliminare " + selezionata.id + "?")) return;

        const publicURL = selezionata.percorsoimmagine;
        const filePath = publicURL.split("/object/public/Immagini/")[1];
        
        await db.storage.from("Immagini").remove([filePath]);

        const { error: dbError } = await db
            .from("colorazioni")
            .delete()
            .eq("id", selezionata.id);

        if (dbError) {
            alert("Errore eliminando colorazione");
            return;
        }

        selezionata = null;
        loadColorazioni();
    }

    async function cambiaImmagine(id) {
        const colorazione = colorazioniCache.find(c => c.id === id);
        if (!colorazione) return;

        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";

        input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;

            if (!confirm("Vuoi sostituire l'immagine di " + id + "?")) return;

            // Percorso reale del file nel bucket
            const oldPath = `${id}.png`;

            // Elimino vecchia immagine
            const { error: removeError } = await db.storage
                .from("Immagini")
                .remove([oldPath]);

            if (removeError) {
                console.error(removeError);
                alert("Errore eliminando immagine");
                return;
            }

            // Carico nuova immagine (sovrascrive)
            const { error: uploadError } = await db.storage
                .from("Immagini")
                .upload(oldPath, file, { upsert: true });

            if (uploadError) {
                alert("Errore caricando nuova immagine");
                console.error(uploadError);
                return;
            }

            // Ottengo nuovo URL pubblico
            const { data: urlData } = db.storage
                .from("Immagini")
                .getPublicUrl(oldPath);

            const newURL = urlData.publicUrl;

            // Aggiorno DB
            await db
                .from("colorazioni")
                .update({ percorsoimmagine: newURL })
                .eq("id", id);

            // Aggiorno cache e tabella
            colorazione.percorsoimmagine = newURL;
            loadColorazioni();
        };

        input.click();
    }



</script>

</body>
</html>
