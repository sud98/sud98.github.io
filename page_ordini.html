<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ordini · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <a class="icon-btn" href="index.html" aria-label="Torna alla home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Ordini</h1>
</header>
<main class="page">
    <div class="filters cols-3">
        <input class="full" type="text" id="filtro_destinatario" placeholder="Cerca destinatario..." oninput="filterOrdini()">
        <select id="filtro_stato" onchange="filterOrdini()">
            <option value="">Tutti gli stati</option>
            <option value="IN LAVORAZIONE">In lavorazione</option>
            <option value="PREPARATO">Preparato</option>
            <option value="CONSEGNATO">Consegnato</option>
        </select>
        <input type="date" id="filtro_data" onchange="filterOrdini()" aria-label="Data di scadenza">
    </div>
    <p class="hint">Tocca un ordine per selezionarlo, poi premi «Apri». Tocca ✔ / ✘ per cambiare il pagamento.</p>
    <div class="table-wrap">
        <table id="table_ordini">
            <thead>
                <tr>
                    <th>Destinatario</th>
                    <th>Scadenza</th>
                    <th>Stato</th>
                    <th>Pagato</th>
                </tr>
            </thead>
            <tbody><tr><td colspan="4" class="loading">Caricamento…</td></tr></tbody>
        </table>
    </div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaOrdine()">Elimina</button>
        <button class="btn btn-secondary" onclick="apriOrdineSelezionato()">Apri</button>
        <button class="btn btn-primary" onclick="vaiAggiungiOrdine()">+ Nuovo</button>
    </div>
</footer>
<script>
    const { createClient } = supabase;

    const db = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    let ordiniCache = [];
    let ordineSelezionato = null;

    window.onload = async () => {
        await loadOrdini();
    };

    async function loadOrdini() {
        const { data, error } = await db
            .from("ordini")
            .select("*")
            .order("scadenza_consegna", { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        ordiniCache = data;
        renderOrdini();
    }

    function renderOrdini() {
        const tbody = document.querySelector("#table_ordini tbody");
        tbody.innerHTML = "";

        const fDest = document.getElementById("filtro_destinatario").value.toLowerCase();
        const fStato = document.getElementById("filtro_stato").value;
        const fData  = document.getElementById("filtro_data").value;

        ordiniCache
            .filter(o => !fDest || o.destinatario.toLowerCase().includes(fDest))
            .filter(o => !fStato || o.stato === fStato)
            .filter(o => !fData || o.scadenza_consegna === fData)
            .forEach(row => {
                const tr = document.createElement("tr");

                tr.onclick = () => {
                    ordineSelezionato = row;
                    evidenziaRiga(tr);
                };

                tr.ondblclick = () => apriDettaglioOrdine(row.id);

                // --- AGGIUNTA CLASSE STATO ---
                let classeStato = "";
                let testo_stato = "";
                if (row.stato === "IN LAVORAZIONE") {classeStato = "stato-lavorazione"; testo_stato = "IN LAV";} 
                else if (row.stato === "PREPARATO") {classeStato = "stato-preparato"; testo_stato = "PREP";}
                else if (row.stato === "CONSEGNATO") {classeStato = "stato-consegnato"; testo_stato = "CONS";}

                tr.innerHTML = `
                    <td>${row.destinatario}</td>
                    <td>${row.scadenza_consegna}</td>
                    <td><span class="${classeStato}">${testo_stato}</span></td>
                    <td class="flag-btn ${row.pagato ? 'flag-true' : 'flag-false'}"
                    onclick="togglePagato('${row.id}', ${row.pagato}, '${row.destinatario}')">
                    ${row.pagato ? '✔' : '✘'} </td>
                `;

                tbody.appendChild(tr);
            });


    }

    async function togglePagato(id, currentValue, destinatarioOrdine) {
        const newValue = !currentValue;
       
        // 1️⃣ Aggiorno la tabella ORDINI
        await db.from("ordini")
            .update({ pagato: newValue })
            .eq("id", id);

        // 2️⃣ Prendo tutte le righe collegate nella tabella ORDINE_DETTAGLIO
        const { data: dettagli, error } = await db
            .from("ordine_dettaglio")
            .select("*")
            .eq("ordineid", id);

        if (error) {
            console.error("Errore nel recupero dei dettagli:", error);
            return;
        }

        // 3️⃣ Aggiorno pagato anche in ordine_dettaglio
        await db.from("ordine_dettaglio")
            .update({ pagato: newValue })
            .eq("ordineid", id);

        // 4️⃣ Per ogni riga eseguo inserisciVendita o rimuoviVendita
        for (const dett of dettagli) {
            
            if (newValue === true) {
                await inserisciVendita(dett.colorazioneid, dett.prezzo, destinatarioOrdine);
            } else {
                await rimuoviVendita(dett.colorazioneid, dett.prezzo, destinatarioOrdine);
            }
        }
        
        // 5️⃣ Ricarico la UI
        loadOrdini();
    }

    async function inserisciVendita(colorazioneid, prezzo, destinatarioOrdine) {
        const now = new Date().toISOString();

        await db.from("vendite").insert([
            {
                colorazioneid,
                prezzo,
                data: now,
                destinatario: destinatarioOrdine
            }
        ]);
    }

    async function rimuoviVendita(colorazioneid, prezzo, destinatarioOrdine) {
        // Trova la vendita più recente
        const { data } = await db
            .from("vendite")
            .select("*")
            .eq("colorazioneid", colorazioneid)
            .eq("destinatario", destinatarioOrdine)
            .eq("prezzo", prezzo)
            .order("data", { ascending: false })
            .limit(1);

        if (data && data.length > 0) {
            await db.from("vendite").delete().eq("id", data[0].id);
        }
    }

    function filterOrdini() {
        renderOrdini();
    }

    function evidenziaRiga(trSel) {
        document.querySelectorAll("#table_ordini tbody tr").forEach(tr => {
            tr.classList.remove("selezionata");
        });
        trSel.classList.add("selezionata");
    }

    function vaiAggiungiOrdine() {
        window.location.href = "page_aggiungi_ordine.html";
    }

    async function eliminaOrdine() {
        if (!ordineSelezionato) {
            alert("Seleziona un ordine");
            return;
        }

        if (!confirm("Vuoi eliminare l'ordine di " + ordineSelezionato.destinatario + "?")) return;

        const { error } = await db
            .from("ordini")
            .delete()
            .eq("id", ordineSelezionato.id);

        if (error) {
            alert("Errore eliminando ordine");
            return;
        }

        ordineSelezionato = null;
        loadOrdini();
    }

    function apriOrdineSelezionato() {
        if (!ordineSelezionato) {
            alert("Seleziona un ordine");
            return;
        }
        apriDettaglioOrdine(ordineSelezionato.id);
    }
    function apriDettaglioOrdine(ordineID) {
        window.location.href = "page_ordine_dettaglio.html?id=" + ordineID;
    }
</script>

</body>
</html>
