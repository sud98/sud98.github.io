<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acquisti · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <a class="icon-btn" href="index.html" aria-label="Torna alla home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Acquisti</h1>
</header>
<main class="page">
    <div class="filters">
        <input type="text" id="filtro_testo" class="full" placeholder="Cerca descrizione o negozio..." oninput="mostraTabella()">
    </div>
    <p class="hint" id="riepilogo">Tocca un acquisto per selezionarlo. Tocca un campo per modificarlo.</p>
    <div class="table-wrap wide" id="tabella"><p>Caricamento…</p></div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaRiga()">Elimina</button>
        <button class="btn btn-primary" onclick="vaiAggiungi()">+ Nuovo acquisto</button>
    </div>
</footer>
    <script>
        const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
        );

        let rigaSelezionata = null;
        let acquisti = [];

        // Prima descrizione e prezzo, poi il resto; l'ID non si modifica
        const colonne = [
            { campo: "descrizione", titolo: "Descrizione" },
            { campo: "prezzo",      titolo: "Prezzo" },
            { campo: "data",        titolo: "Data" },
            { campo: "negozio",     titolo: "Negozio" },
            { campo: "link",        titolo: "Link" },
            { campo: "id",          titolo: "ID" }
        ];

        const esc = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

        async function caricaTabella() {
            const { data, error } =
                await client.from("acquisti").select("*").order("data", { ascending: false });

            if (error) {
                console.error(error);
                document.getElementById("tabella").innerHTML = "<p>Errore nel caricamento</p>";
                return;
            }
            acquisti = data || [];
            mostraTabella();
        }

        function mostraTabella() {
            const lista = filtrati();
            mostraRiepilogo(lista);
            document.getElementById("tabella").innerHTML = generaHTMLTabella(lista);
        }

        function mostraRiepilogo(lista) {
            const totale = lista.reduce((s, r) => s + Number(r.prezzo || 0), 0);
            document.getElementById("riepilogo").textContent =
                `${lista.length} ${lista.length === 1 ? "acquisto" : "acquisti"} · € ${totale.toFixed(2)}. Tocca un campo per modificarlo.`;
        }

        function filtrati() {
            const testo = document.getElementById("filtro_testo").value.trim().toLowerCase();
            return acquisti.filter(r => !testo ||
                (r.descrizione || "").toLowerCase().includes(testo) ||
                (r.negozio || "").toLowerCase().includes(testo));
        }

        function generaHTMLTabella(dati) {
            if (!dati.length) return "<p>Nessun dato trovato.</p>";

            let html = "<table><thead><tr>";
            for (const col of colonne) html += `<th>${col.titolo}</th>`;
            html += "</tr></thead><tbody>";

            for (const riga of dati) {
                html += `<tr data-id="${riga.id}" onclick="selezionaRiga(this)">`;

                for (const { campo } of colonne) {
                    const valore = riga[campo] ?? "";
                    if (campo === "id") {
                        html += `<td>${esc(valore)}</td>`;
                    } else if (campo === "data") {
                        html += `<td><input type="date" value="${esc(String(valore).slice(0, 10))}"
                                    onchange="salvaCampo(${riga.id}, 'data', this.value)"></td>`;
                    } else if (campo === "link") {
                        const apri = valore ? ` <a href="${esc(valore)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apri ↗</a>` : "";
                        html += `<td><span contenteditable="true" class="modificabile"
                                    onblur="salvaCampo(${riga.id}, 'link', this.innerText)">${esc(valore)}</span>${apri}</td>`;
                    } else {
                        html += `<td contenteditable="true"
                                    onblur="salvaCampo(${riga.id}, '${campo}', this.innerText)">${esc(valore)}</td>`;
                    }
                }
                html += "</tr>";
            }

            html += "</tbody></table>";
            return html;
        }

        // Salvo un campo quando esco dalla casella (solo se è cambiato)
        async function salvaCampo(id, campo, testo) {
            const riga = acquisti.find(r => r.id === id);
            if (!riga) return;

            let valore = String(testo).trim();
            if (campo === "prezzo") {
                valore = parseFloat(valore.replace(",", "."));
                if (isNaN(valore)) {
                    alert("Prezzo non valido");
                    mostraTabella();
                    return;
                }
            }
            if (campo === "data" && !valore) {
                alert("Inserisci una data.");
                mostraTabella();
                return;
            }

            const prima = campo === "data" ? String(riga.data ?? "").slice(0, 10) : riga[campo] ?? "";
            if (valore === prima) return;

            const { error } = await client
                .from("acquisti")
                .update({ [campo]: valore })
                .eq("id", id);

            if (error) {
                alert("Errore durante il salvataggio: " + error.message);
                caricaTabella();
                return;
            }

            riga[campo] = valore;
            if (campo === "prezzo") mostraRiepilogo(filtrati());
            if (campo === "link") mostraTabella();      // per aggiornare «Apri ↗»
        }

        function selezionaRiga(tr) {
            document.querySelectorAll("tr").forEach(r => r.classList.remove("selezionata"));
            tr.classList.add("selezionata");

            rigaSelezionata = Number(tr.dataset.id);
        }

        async function eliminaRiga() {
            if (!rigaSelezionata) {
                alert("Seleziona una riga prima di eliminare.");
                return;
            }
            if (!confirm("Vuoi eliminare la riga selezionata?")) return;
            
            const { error } = await client
                .from("acquisti")
                .delete()
                .eq("id", rigaSelezionata);

            if (error) {
                alert("Errore durante l'eliminazione.");
                return;
            }

            alert("Riga eliminata.");
            rigaSelezionata = null;
            caricaTabella();
        }

        function vaiAggiungi() {
            window.location.href = "page_aggiungi_acquisto.html";
        }

        window.onload = caricaTabella;
    </script>

</body>
</html>
