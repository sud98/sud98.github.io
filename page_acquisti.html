<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acquisti · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <a class="icon-btn" href="index.html" aria-label="Torna alla home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Acquisti</h1>
</header>
<main class="page">
    <p class="hint">Tocca un acquisto per selezionarlo.</p>
    <div class="table-wrap wide" id="tabella"><p>Caricamento…</p></div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaRiga()">Elimina</button>
        <button class="btn btn-primary" onclick="vaiAggiungi()">+ Nuovo acquisto</button>
    </div>
</footer>
    <script>
        const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
        );

        let rigaSelezionata = null;

        const colonne = ["id", "descrizione", "prezzo", "data", "negozio", "link"];

        async function caricaTabella() {
            const { data: acquisti } =
                await client.from("acquisti").select("*").order("data", { ascending: false });

            document.getElementById("tabella").innerHTML =
                generaHTMLTabella(acquisti);
        }

        function generaHTMLTabella(dati) {
            if (!dati.length) return "<p>Nessun dato trovato.</p>";

            let html = "<table><tr>";

            for (const col of colonne) {
                html += `<th>${col}</th>`;
            }

            html += "</tr>";

            for (const riga of dati) {
                html += `<tr data-id="${riga.id}" onclick="selezionaRiga(this)">`;

                for (const col of colonne) {
                    if (col === "link") {
                        const url = riga[col] || "";
                        html += `<td><a href="${url}" target="_blank">${url}</a></td>`;
                    } else {
                        html += `<td>${riga[col] ?? ""}</td>`;
                    }
                }

                html += "</tr>";
            }

            html += "</table>";
            return html;
        }

        function selezionaRiga(tr) {
            document.querySelectorAll("tr").forEach(r => r.classList.remove("selezionata"));
            tr.classList.add("selezionata");

            rigaSelezionata = Number(tr.dataset.id);
            console.log("ID selezionato:", rigaSelezionata);
        }

        async function eliminaRiga() {
            if (!rigaSelezionata) {
                alert("Seleziona una riga prima di eliminare.");
                return;
            }
            if (!confirm("Vuoi eliminare la riga selezionata?")) return;
            
            const { error } = await client
                .from("acquisti")
                .delete()
                .eq("id", rigaSelezionata);

            if (error) {
                alert("Errore durante l'eliminazione.");
                return;
            }

            alert("Riga eliminata.");
            rigaSelezionata = null;
            caricaTabella();
        }

        function vaiAggiungi() {
            window.location.href = "page_aggiungi_acquisto.html";
        }

        window.onload = caricaTabella;
    </script>

</body>
</html>
