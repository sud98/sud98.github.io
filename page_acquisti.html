<!DOCTYPE html>
<html>
<head>          
    <meta charset="utf-8" />
    <title>Monitor Acquisti</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            flex: 0 0 8%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-table {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-buttons {
            flex: 0 0 8%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .scroll-box {
            flex: 1;
            width: 95%;
            margin: auto;
            overflow-y: auto;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
        }

        .btn {
            height: 90%;
            width: 40%;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .btn-add { background-color: #28a745; }
        .btn-del { background-color: #dc3545; }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 18px;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #444;
            padding: 10px 20px;
        }

        th {
            background-color: #eee;
        }

        /* Nascondo la colonna ID */
        td:nth-child(1), th:nth-child(1) {
            display: none;
        }

        tr.selezionata {
            background-color: #ffe08a;
        }

        td:nth-child(3), th:nth-child(3),
        td:nth-child(4), th:nth-child(4) {
            text-align: center;
        }

        a {
            color: #0077cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Colonna 2: descrizione */
        td:nth-child(2), th:nth-child(2) {
            width: 35%;
        }

        /* Colonna 3: prezzo */
        td:nth-child(3), th:nth-child(3) {
            width: 10%;
            text-align: center;
        }

        /* Colonna 4: data */
        td:nth-child(4), th:nth-child(4) {
            width: 10%;
            text-align: center;
        }

        /* Colonna 5: negozio */
        td:nth-child(5), th:nth-child(5) {
            width: 10%;
        }

        /* Colonna 6: link */
        /* Colonna link: mostra solo una parte, niente scroll */
        td:nth-child(6) a {
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }





    </style>
</head>

<body>

    <div class="section-title">
        <h1>Tabella Acquisti</h1>
    </div>

    <div class="section-table">
        <div class="scroll-box">
            <div id="tabella"></div>
        </div>
    </div>

    <div class="section-buttons">
        <button class="btn btn-add" onclick="vaiAggiungi()">AGGIUNGI</button>
        <button class="btn btn-del" onclick="eliminaRiga()">ELIMINA</button>
    </div>

    <script>
        const client = supabase.createClient(
            "https://ixarnqyrsonhshkctcki.supabase.co",
            "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
        );

        let rigaSelezionata = null;

        const colonne = ["id", "descrizione", "prezzo", "data", "negozio", "link"];

        async function caricaTabella() {
            const { data: acquisti } =
                await client.from("acquisti").select("*").order("data", { ascending: false });

            document.getElementById("tabella").innerHTML =
                generaHTMLTabella(acquisti);
        }

        function generaHTMLTabella(dati) {
            if (!dati.length) return "<p>Nessun dato trovato.</p>";

            let html = "<table><tr>";

            for (const col of colonne) {
                html += `<th>${col}</th>`;
            }

            html += "</tr>";

            for (const riga of dati) {
                html += `<tr data-id="${riga.id}" onclick="selezionaRiga(this)">`;

                for (const col of colonne) {
                    if (col === "link") {
                        const url = riga[col] || "";
                        html += `<td><a href="${url}" target="_blank">${url}</a></td>`;
                    } else {
                        html += `<td>${riga[col] ?? ""}</td>`;
                    }
                }

                html += "</tr>";
            }

            html += "</table>";
            return html;
        }

        function selezionaRiga(tr) {
            document.querySelectorAll("tr").forEach(r => r.classList.remove("selezionata"));
            tr.classList.add("selezionata");

            rigaSelezionata = Number(tr.dataset.id);
            console.log("ID selezionato:", rigaSelezionata);
        }

        async function eliminaRiga() {
            if (!rigaSelezionata) {
                alert("Seleziona una riga prima di eliminare.");
                return;
            }
            
            const { error } = await client
                .from("acquisti")
                .delete()
                .eq("id", rigaSelezionata);

            if (error) {
                alert("Errore durante l'eliminazione.");
                return;
            }

            alert("Riga eliminata.");
            rigaSelezionata = null;
            caricaTabella();
        }

        function vaiAggiungi() {
            window.location.href = "page_aggiungi_acquisto.html";
        }

        window.onload = caricaTabella;
    </script>

</body>
</html>
