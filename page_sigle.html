<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Sigle</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .box {
            background: #333;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .row > div {
            flex: 1;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add { background: #4CAF50; color: white; }
        .btn-del { background: #d9534f; color: white; }
    </style>
</head>

<body>

<div class="container">

    <!-- ============================
         COLONNA PRODOTTI
    ============================= -->
    <div class="box">
        <h2>Prodotti</h2>

        <input id="filter_prodotti" placeholder="Filtra..." oninput="filterProdotti()">

        <table id="table_prodotti">
            <thead>
                <tr>
                    <th>Prodotto</th>
                    <th>Sigla</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="row">
            <div><input id="prod_codice" placeholder="Prodotto" oninput="this.value = this.value.toUpperCase()"></div>
            <div><input id="prod_sigla" maxlength="3" placeholder="Sigla" oninput="this.value = this.value.toUpperCase()"></div>
        </div>

        <div class="buttons">
            <button class="btn-add" onclick="addProdotto()">Aggiungi</button>
            <button class="btn-del" onclick="deleteProdotto()">Elimina</button>
        </div>
    </div>


    <!-- ============================
         COLONNA TIPOLOGIE
    ============================= -->
    <div class="box">
        <h2>Tipologie</h2>

        <input id="filter_tipologie" placeholder="Filtra..." oninput="filterTipologie()">

        <table id="table_tipologie">
            <thead>
                <tr>
                    <th>Prodotto</th>
                    <th>Tipologia</th>
                    <th>Sigla</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="row">
            <div><select id="tip_prod"></select></div>
            <div><input id="tip_codice" placeholder="Tipologia" oninput="this.value = this.value.toUpperCase()"></div>
            <div><input id="tip_sigla" maxlength="3" placeholder="Sigla" oninput="this.value = this.value.toUpperCase()"></div>
        </div>

        <div class="buttons">
            <button class="btn-add" onclick="addTipologia()">Aggiungi</button>
            <button class="btn-del" onclick="deleteTipologia()">Elimina</button>
        </div>
    </div>


    <!-- ============================
         COLONNA TEMI
    ============================= -->
    <div class="box">
        <h2>Temi</h2>

        <input id="filter_temi" placeholder="Filtra..." oninput="filterTemi()">

        <table id="table_temi">
            <thead>
                <tr>
                    <th>Tema</th>
                    <th>Sigla</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="row">
            <div><input id="tema_codice" placeholder="Tema" oninput="this.value = this.value.toUpperCase()"></div>
            <div><input id="tema_sigla" maxlength="3" placeholder="Sigla" oninput="this.value = this.value.toUpperCase()"></div>
        </div>

        <div class="buttons">
            <button class="btn-add" onclick="addTema()">Aggiungi</button>
            <button class="btn-del" onclick="deleteTema()">Elimina</button>
        </div>
    </div>

</div>

<script>
    const { createClient } = supabase;
    const db = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    window.onload = async () => {
        await loadProdotti();
        await loadTipologie();
        await loadTemi();
    };

    async function loadProdotti() {
    const { data, error } = await db
        .from("sigla_prodotto")
        .select("*")
        .order("codice", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    const tbody = document.querySelector("#table_prodotti tbody");
        tbody.innerHTML = "";

        data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.codice}</td>
                <td>${row.sigla}</td>
            `;
            tr.onclick = () => selectProdotto(row);
            tbody.appendChild(tr);
        });

        // Popola la combo nella sezione Tipologie
        populateProdottiCombo(data);
    }

    function selectProdotto(row) {
        document.getElementById("prod_codice").value = row.codice;
        document.getElementById("prod_sigla").value = row.sigla;
    }

    async function addProdotto() {
        const codice = document.getElementById("prod_codice").value.trim();
        const sigla = document.getElementById("prod_sigla").value.trim();

        if (!codice || !sigla) {
            alert("Compila tutti i campi");
            return;
        }

        const { error } = await db
            .from("sigla_prodotto")
            .insert([{ codice, sigla }]);

        if (error) {
            alert("Errore: " + error.message);
            return;
        }

        await loadProdotti();
    }

    async function deleteProdotto() {
        const codice = document.getElementById("prod_codice").value.trim();

        if (!codice) {
            alert("Seleziona un prodotto");
            return;
        }

        const { error } = await db
            .from("sigla_prodotto")
            .delete()
            .eq("codice", codice);

        if (error) {
            alert("Errore: " + error.message);
            return;
        }

        await loadProdotti();
    }

    function filterProdotti() {
        const filter = document.getElementById("filter_prodotti").value.toLowerCase();
        const rows = document.querySelectorAll("#table_prodotti tbody tr");

        rows.forEach(r => {
            r.style.display = r.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    }

    async function loadTipologie() {
        const { data, error } = await db
            .from("sigla_tipologia")
            .select("*")
            .order("prodotto", { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        const tbody = document.querySelector("#table_tipologie tbody");
        tbody.innerHTML = "";

        data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.prodotto}</td>
                <td>${row.codice}</td>
                <td>${row.sigla}</td>
            `;
            tr.onclick = () => selectTipologia(row);
            tbody.appendChild(tr);
        });
    }

    function populateProdottiCombo(prodotti) {
        const combo = document.getElementById("tip_prod");
        combo.innerHTML = "";

        prodotti.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.codice;
            opt.textContent = p.codice;
            combo.appendChild(opt);
        });
    }

    function selectTipologia(row) {
        document.getElementById("tip_prod").value = row.prodotto;
        document.getElementById("tip_codice").value = row.codice;
        document.getElementById("tip_sigla").value = row.sigla;
    }

    async function addTipologia() {
        const prodotto = document.getElementById("tip_prod").value;
        const codice = document.getElementById("tip_codice").value.trim();
        const sigla = document.getElementById("tip_sigla").value.trim();

        if (!prodotto || !codice || !sigla) {
            alert("Compila tutti i campi");
            return;
        }

        const { error } = await db
            .from("sigla_tipologia")
            .insert([{ prodotto, codice, sigla }]);

        if (error) {
            alert("Errore: " + error.message);
            return;
        }

        await loadTipologie();
    }

    async function deleteTipologia() {
        const codice = document.getElementById("tip_codice").value.trim();

        if (!codice) {
            alert("Seleziona una tipologia");
            return;
        }

        const { error } = await db
            .from("sigla_tipologia")
            .delete()
            .eq("codice", codice);

        if (error) {
            alert("Errore: " + error.message);
            return;
        }

        await loadTipologie();
    }

    function filterTipologie() {
        const filter = document.getElementById("filter_tipologie").value.toLowerCase();
        const rows = document.querySelectorAll("#table_tipologie tbody tr");

        rows.forEach(r => {
            r.style.display = r.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    }

    async function loadTemi() {
        const { data, error } = await db
            .from("sigla_tema")
            .select("*")
            .order("codice", { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        const tbody = document.querySelector("#table_temi tbody");
        tbody.innerHTML = "";

        data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.codice}</td>
                <td>${row.sigla}</td>
            `;
            tr.onclick = () => selectTema(row);
            tbody.appendChild(tr);
        });
    }

    function selectTema(row) {
        document.getElementById("tema_codice").value = row.codice;
        document.getElementById("tema_sigla").value = row.sigla;
    }

    async function addTema() {
        const codice = document.getElementById("tema_codice").value.trim();
        const sigla = document.getElementById("tema_sigla").value.trim();

        if (!codice || !sigla) {
            alert("Compila tutti i campi");
            return;
        }

        const { error } = await db
            .from("sigla_tema")
            .insert([{ codice, sigla }]);

        if (error) {
            alert("Errore: " + error.message);
            return;
        }

        await loadTemi();
    }

    async function deleteTema() {
        const codice = document.getElementById("tema_codice").value.trim();

        if (!codice) {
            alert("Seleziona un tema");
            return;
        }

        const { error } = await db
            .from("sigla_tema")
            .delete()
            .eq("codice", codice);

        if (error) {
            alert("Errore: " + error.message);
            return;
        }

        await loadTemi();
    }

    function filterTemi() {
        const filter = document.getElementById("filter_temi").value.toLowerCase();
        const rows = document.querySelectorAll("#table_temi tbody tr");

        rows.forEach(r => {
            r.style.display = r.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    }

</script>

</body>
</html>
