<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Prodotti · GE WoodArt</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WoodArt">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-list">
<header class="app-header">
    <a class="icon-btn" href="index.html" aria-label="Torna alla home"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Prodotti</h1>
</header>
<main class="page">
    <div class="filters">
        <select id="filtro_prodotto" onchange="filterProdotti()">
            <option value="">Tutti i prodotti</option>
        </select>
        <select id="filtro_tipologia" onchange="filterProdotti()">
            <option value="">Tutte le tipologie</option>
        </select>
        <select id="filtro_tema" onchange="filterProdotti()">
            <option value="">Tutti i temi</option>
        </select>
        <input type="text" id="filtro_descrizione" placeholder="Cerca..." oninput="filterProdotti()">
    </div>
    <p class="hint">Tocca un prodotto per selezionarlo. Descrizione e prezzo si modificano toccandoli.</p>
    <div class="table-wrap wide">
        <table id="table_prodotti">
            <thead>
                <tr>
                    <th>Descrizione</th>
                    <th>Immagine</th>
                    <th>Prezzo</th>
                    <th>Prodotto</th>
                    <th>Tipologia</th>
                    <th>Tema</th>
                    <th>ID</th>
                </tr>
            </thead>
            <tbody><tr><td colspan="7" class="loading">Caricamento…</td></tr></tbody>
        </table>
    </div>
</main>
<footer class="action-bar">
    <div class="action-bar-inner">
        <button class="btn btn-danger" onclick="eliminaProdotto()">Elimina</button>
        <button class="btn btn-secondary" onclick="apriProdottoSelezionato()">Colori</button>
        <button class="btn btn-primary" onclick="vaiAggiungiProdotto()">+ Nuovo</button>
    </div>
</footer>
<script>
    const { createClient } = supabase;

    const db = createClient(
        "https://ixarnqyrsonhshkctcki.supabase.co",
        "sb_publishable_pGINBChZ1U3J4xUEvb0XtQ_pR7wc9eZ"
    );

    const BASE_IMG_URL = "https://ixarnqyrsonhshkctcki.supabase.co/storage/v1/object/public/Immagini/";

    let prodottiCache = [];
    let prodottoSelezionato = null;

    window.onload = async () => {
        await loadFiltri();
        await loadProdotti();
    };

    /* ============================
       CARICAMENTO FILTRI
    ============================ */
    async function loadFiltri() {
        const [prodotti, tipologie, temi] = await Promise.all([
            db.from("sigla_prodotto").select("*").order("codice", { ascending: true }),
            db.from("sigla_tipologia").select("*").order("codice", { ascending: true }),
            db.from("sigla_tema").select("*").order("codice", { ascending: true })
        ]);

        const selProd = document.getElementById("filtro_prodotto");
        const selTip  = document.getElementById("filtro_tipologia");
        const selTema = document.getElementById("filtro_tema");

        if (!prodotti.error) {
            prodotti.data.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.codice;
                opt.textContent = p.codice;
                selProd.appendChild(opt);
            });
        }

        if (!tipologie.error) {
            tipologie.data.forEach(t => {
                const opt = document.createElement("option");
                opt.value = t.codice;
                opt.textContent = t.codice;
                selTip.appendChild(opt);
            });
        }

        if (!temi.error) {
            temi.data.forEach(t => {
                const opt = document.createElement("option");
                opt.value = t.codice;
                opt.textContent = t.codice;
                selTema.appendChild(opt);
            });
        }
    }

    /* ============================
       CARICAMENTO PRODOTTI
    ============================ */
    async function loadProdotti() {
        const { data, error } = await db
            .from("prodotti")
            .select("*")
            .order("id", { ascending: true });

        if (error) {
            console.error(error);
            return;
        }

        prodottiCache = data || [];
        renderProdotti();
    }

    function renderProdotti() {
        const tbody = document.querySelector("#table_prodotti tbody");
        tbody.innerHTML = "";

        const fProd = document.getElementById("filtro_prodotto").value;
        const fTip  = document.getElementById("filtro_tipologia").value;
        const fTema = document.getElementById("filtro_tema").value;
        const fDesc = document.getElementById("filtro_descrizione").value.toLowerCase();

        prodottiCache
            .filter(p => !fProd || p.prodotto === fProd)
            .filter(p => !fTip  || p.tipologia === fTip)
            .filter(p => !fTema || p.tema === fTema)
            .filter(p => !fDesc || (p.descrizione || "").toLowerCase().includes(fDesc))
            .forEach(row => {
            const tr = document.createElement("tr");

            // CLICK singolo → seleziona la riga
            tr.onclick = () => {
                prodottoSelezionato = row;
                evidenziaRiga(tr);
            };

            // DOPPIO CLICK → apre pagina colorazioni
            tr.ondblclick = () => apriColorazioni(row.id);

            //const imgUrl = BASE_IMG_URL + row.id + "_01.png";
            const imgUrl = BASE_IMG_URL + row.id + "_01.png";
            tr.innerHTML = `
                <td contenteditable="true"
                    onblur="updateDescrizione('${row.id}', this.innerText)">
                    ${row.descrizione || ""}
                </td>
                <td><img src="${imgUrl}" alt=""></td>
                <td contenteditable="true"
                    onblur="updatePrezzo('${row.id}', this.innerText)">
                    ${row.prezzo ?? ""}
                </td>
                <td>${row.prodotto}</td>
                <td>${row.tipologia}</td>
                <td>${row.tema}</td>
                <td>${row.id}</td>
            `;

            tbody.appendChild(tr);
        });

    

    }

    function filterProdotti() {
        renderProdotti();
    }

    function evidenziaRiga(trSelezionata) {
        document.querySelectorAll("#table_prodotti tbody tr").forEach(tr => {
            tr.classList.remove("selezionata");
        });
        trSelezionata.classList.add("selezionata");
    }

    /* ============================
       UPDATE INLINE
    ============================ */
    async function updateDescrizione(id, value) {
        const descrizione = value.trim();

        const { error } = await db
            .from("prodotti")
            .update({ descrizione })
            .eq("id", id);

        if (error) {
            alert("Errore aggiornando descrizione: " + error.message);
            await loadProdotti();
        }
    }

    async function updatePrezzo(id, value) {
        const prezzo = parseFloat(value.replace(",", "."));

        if (isNaN(prezzo)) {
            alert("Prezzo non valido");
            await loadProdotti();
            return;
        }

        const { error } = await db
            .from("prodotti")
            .update({ prezzo })
            .eq("id", id);

        if (error) {
            alert("Errore aggiornando prezzo: " + error.message);
            await loadProdotti();
        }
    }

    /* ============================
       PULSANTI
    ============================ */
    function vaiAggiungiProdotto() {
        window.location.href = "page_aggiungi_prodotto.html";
    }

    async function eliminaProdotto() {
        if (!prodottoSelezionato) {
            alert("Seleziona un prodotto dalla tabella");
            return;
        }

        if (!confirm("Vuoi davvero eliminare il prodotto " + prodottoSelezionato.id + "?")) {
            return;
        }

        const { error } = await db
            .from("prodotti")
            .delete()
            .eq("id", prodottoSelezionato.id);

        if (error) {
            alert("Errore eliminando prodotto: " + error.message);
            return;
        }

        prodottoSelezionato = null;
        await loadProdotti();
    }

    function creaBrochure() {
        console.log("Funzione brochure non ancora implementata");
    }

    function apriProdottoSelezionato() {
        if (!prodottoSelezionato) {
            alert("Seleziona un prodotto dalla tabella");
            return;
        }
        apriColorazioni(prodottoSelezionato.id);
    }
    function apriColorazioni(idProdotto) { 
        window.location.href = "page_colorazioni.html?id=" + idProdotto;
    }
</script>

</body>
</html>
